      status: root.querySelector(".save-status"),
    };

    const cleanups = [];
    const on = (target, type, fn, opts) => { target.addEventListener(type, fn, opts); cleanups.push(() => target.removeEventListener(type, fn, opts)); };
    ProjectView.cleanup = () => cleanups.forEach((f) => f());

    /* ---------- Historique : chaque enregistrement est une étape annulable ---------- */
    useCoef(p);
    const snapshot = () => JSON.stringify({ title: p.title, tasks: p.tasks, links: p.links, coef: p.ui.coef });
    if (!History.has(id)) History.set(id, { undo: [], redo: [], ...HistoryStore.load(id), last: snapshot() });
    const hist = History.get(id);
    hist.last = snapshot();
    // bouton « Annuler » du bandeau : grisé quand il n'y a rien à annuler
    const undoBtn = root.querySelector('[data-act="undo"]');
    const paintUndo = () => { undoBtn.disabled = !hist.undo.length; };

    const restore = (state) => {
      const o = JSON.parse(state);
      p.title = o.title; p.tasks = o.tasks; p.links = o.links;
      if (o.coef) p.ui.coef = o.coef; else delete p.ui.coef;
      useCoef(p);
      hist.last = state;
      Store.updateProject(id, {});
      titleEl.textContent = p.title;
      document.title = p.title + " — Plan Projet";
      if (sel) { sel.r = Math.min(sel.r, p.tasks.length - 1); sel.r2 = sel.r; sel.c2 = sel.c; if (sel.r < 0) sel = null; }
      renderAll();
    };
    const undo = () => {
      if (editor) editor.input.blur();
      if (!hist.undo.length) { toast("Rien à annuler"); return; }
      hist.redo.push(hist.last);
      restore(hist.undo.pop());
      HistoryStore.save(id, hist);
      paintUndo();
      toast(`Action annulée${hist.undo.length ? ` · encore ${hist.undo.length} possible${hist.undo.length > 1 ? "s" : ""}` : ""}`);
    };
    const redo = () => {
      if (editor) editor.input.blur();
      if (!hist.redo.length) { toast("Rien à rétablir"); return; }
      hist.undo.push(hist.last);
      restore(hist.redo.pop());
      HistoryStore.save(id, hist);
      paintUndo();
      toast("Action rétablie");
    };
    undoBtn.addEventListener("click", undo);
    paintUndo();
    on(document, "keydown", (e) => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k !== "z" && k !== "y") return;
      // dans un champ texte, Ctrl + Z annule la frappe (comportement normal du champ)
      const a = document.activeElement;
      if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")) return;
      if (document.querySelector(".modal-backdrop")) return;
      e.preventDefault();
      if (k === "y" || (k === "z" && e.shiftKey)) redo(); else undo();
    });

    /* ---------- Enregistrer (bouton + Ctrl + S) ---------- */
    const save = () => {
      const now = snapshot();
      if (now !== hist.last) { hist.undo.push(hist.last); hist.redo = []; hist.last = now; HistoryStore.save(id, hist); paintUndo(); }
      Store.updateProject(id, {});
      el.status.textContent = "";
    };
    // état de l'enregistrement dans le fichier, affiché dans le bandeau
    const chip = root.querySelector(".file-chip");
    // fichier en cours de modification : chemin à partir du dossier de travail, sinon son nom seul
    let chipName = null;
    const paintChip = async () => {
      const name = Files.fileName(id);
      chipName = name;
      chip.hidden = !name;
      if (!name) return;
      const parts = await WorkDir.pathOf(Files.handles.get(id));
      if (chipName !== name || !chip.isConnected) return;
      chip.innerHTML = `${ICONS.file}<span>${esc(parts ? parts.join(" › ") : name)}</span>`;
      chip.title = parts ? `Fichier en cours de modification : ${parts.join(" › ")}`
        : `Fichier en cours de modification : ${name}\n` + (WorkDir.handle
          ? `Ce fichier n'est pas dans le dossier de travail « ${WorkDir.handle.name} » : seul son nom peut être affiché.`
          : "Pour afficher le dossier du fichier, choisissez votre dossier de travail dans Paramètres (roue dentée).");
    };
    on(document, "workdir", paintChip);
    // coefficient de la durée réglé dans Paramètres (propre au projet, enregistré dans son fichier)
    on(document, "coef", (e) => {
      const v = e.detail;
      if (v === HOURS_TO_DAYS) return;
      mutate(() => {
        if (v === DEFAULT_COEF) delete p.ui.coef; else p.ui.coef = v;
        useCoef(p);
        // durées saisies en jours : elles restent, leurs heures sont recalculées
        p.tasks.forEach((t) => { if (t.dureeFix != null) t.heures = Task.hoursFromDays(t.dureeFix); });
      });
      toast(`Durée jours = Heures × ${fmtNum(v)}`);
    });
    const paintStatus = () => {
      const st = Files.states.get(id), name = Files.fileName(id);
      if (name !== chipName) paintChip();
      el.status.className = "save-status" + (st === "error" ? " error" : "");
      if (st === "saving") el.status.textContent = "Enregistrement…";
      else if (st === "saved" && name) el.status.textContent = "Enregistré";
      else if (st === "permission") {
        el.status.innerHTML = `<button type="button">Autoriser l'enregistrement dans « ${esc(name)} »</button>`;
        el.status.querySelector("button").addEventListener("click", async () => {
          if (await Files.allow(p)) toast("Enregistrement en temps réel activé");
        });
      } else if (st === "error") el.status.textContent = "Échec de l'enregistrement : fichier ouvert dans Excel ? Fermez-le puis Ctrl + S";
      else el.status.textContent = Files.supported ? "Non enregistré — Ctrl + S" : "Ctrl + S pour télécharger le fichier";
    };
    Files.onStatus = (pid) => { if (pid === id) paintStatus(); };
    cleanups.push(() => { if (Files.onStatus) Files.onStatus = null; });
    paintStatus();

    const saveNow = async () => {
      if (editor) editor.input.blur();
      p.updatedAt = todayISO();
      const ok = await Files.flush(p);
      if (ok) toast(Files.fileName(id) ? `Enregistré dans « ${Files.fileName(id)} »` : "Fichier téléchargé");
      else if (Files.states.get(id) === "error") toast("Échec de l'enregistrement");
    };
    const saveAsNow = async () => {
      if (editor) editor.input.blur();
      if (!(await Files.saveAs(p))) return;
      if (Files.fileName(id)) {
        p.title = Files.baseName(Files.fileName(id));   // le titre suit le nom du nouveau fichier
        save();
        showTitle();
        toast(`Enregistré dans « ${Files.fileName(id)} »`);
      } else toast("Fichier téléchargé");
    };
    root.querySelector('[data-act="save"]').addEventListener("click", saveNow);
    root.querySelector('[data-act="save-as"]').addEventListener("click", saveAsNow);

    /* ---------- Exporter / importer (Excel, CSV) ---------- */
    root.querySelector('[data-act="export"]').addEventListener("click", async () => {
      if (editor) editor.input.blur();
      const kind = await choiceDialog({
        title: "Exporter le projet",
        message: "Une ligne par tâche, avec les colonnes du tableau et les liens (« Dépend de »).",
        choices: [{ label: "Annuler", value: null }, { label: "CSV (.csv)", value: "csv" }, { label: "Excel (.xlsx)", value: "xlsx", primary: true }],
      });
      if (!kind) return;
      try {
        const name = await Exchange.save(p, kind);
        if (name) toast(`Exporté dans « ${name} »`);
      } catch (e) { toast("Échec de l'export"); }
    });
    root.querySelector('[data-act="import"]').addEventListener("click", async () => {
      if (editor) editor.input.blur();
      const file = await Exchange.pick();
      if (!file) return;
      let res;
      try { res = Exchange.toTasks(await Exchange.readFile(file)); }
      catch (e) { toast(e.message && !/^(zip|xlsx)$/.test(e.message) ? e.message : "Fichier illisible : choisissez un .xlsx ou un .csv"); return; }
      const n = res.tasks.length;
      const choice = await choiceDialog({
        title: `Importer « ${file.name} »`,
        message: `${n} tâche${n > 1 ? "s" : ""} trouvée${n > 1 ? "s" : ""}. Où les mettre ?`,
        choices: [
          { label: "Annuler", value: null },
          { label: "Remplacer le projet ouvert", value: "replace" },
          { label: "Créer un nouveau projet", value: "new", primary: true },
        ],
      });
      if (choice === "replace") {
        sel = null;
        mutate(() => { p.tasks = res.tasks; Exchange.applyLinks(p, res.links, res.warnings); });
        renderAll();
        Exchange.report(n, res.warnings);   // Ctrl + Z ramène le projet d'avant l'import
      } else if (choice === "new") {
        const np = await Files.createFrom(file.name.replace(/\.[^.]+$/, "") + " (projet)", (q) => { q.tasks = res.tasks; Exchange.applyLinks(q, res.links, res.warnings); });
        if (!np) return;
        openProject(np);
        Exchange.report(n, res.warnings);
      }
    });
    on(document, "keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (e.shiftKey) saveAsNow(); else saveNow(); }
    });

    /* ========================================================
       TABLEAU
       ======================================================== */
    delete p.ui.rowH;   // ancien réglage (lignes plus hautes)
    let rowH = p.ui.rowHeight || DEFAULT_ROW_H;   // hauteur des lignes en pixels
    const barH = () => Math.max(6, Math.min(20, rowH - 8));
    // taille du texte du tableau proportionnelle à la hauteur des lignes
    const cellFont = () => Math.max(8, Math.min(22, Math.round(rowH * 0.5)));
    const applyRowH = () => {
      el.page.style.setProperty("--row-h", rowH + "px");
      el.page.style.setProperty("--cell-font", cellFont() + "px");
      el.page.style.setProperty("--bar-h", barH() + "px");
    };
    applyRowH();

    let sel = null;      // sélection { r, c, r2, c2 } : (r, c) = cellule active, (r2, c2) = autre coin
    let editor = null;   // champ de saisie ouvert

    const colWidth = (c) => (!c.fixed && p.ui.colWidths && p.ui.colWidths[c.key]) || c.w;
    const rect = () => sel && {
      r1: Math.min(sel.r, sel.r2), r2: Math.max(sel.r, sel.r2),
      c1: Math.min(sel.c, sel.c2), c2: Math.max(sel.c, sel.c2),
    };

    const renderTableHead = () => {
      let html = `<div class="trow thead-row">${COLUMNS.map((c, i) =>
        `<div class="tcell${c.compact ? " compact" : ""}"${c.fixed ? " data-fixed" : ""}${c.title ? ` title="${c.title}"` : ""} style="width:${colWidth(c)}px">${esc(c.head || c.label)}${c.fixed ? "" : `<span class="col-resize" data-c="${i}" title="Glisser pour élargir (double-clic : taille d'origine)"></span>`}</div>`).join("")}</div>`;
      if (showFilters) {
        // une recherche par colonne
        const field = (k, w, ph) => `<div class="fcell" style="width:${w}px"><input class="filter-input${normTxt(filters[k]) ? " active" : ""}" data-k="${k}" value="${esc(filters[k] || "")}" placeholder="${ph}" title="Filtrer : ${ph}" spellcheck="false">${normTxt(filters[k]) ? `<button class="filter-clear" data-clear="${k}" title="Effacer ce filtre">×</button>` : ""}</div>`;
        const cells = COLUMNS.map((c) => field(c.key, colWidth(c), c.label + "…")).join("");
        html += `<div class="trow filter-row">${cells}</div>`;
      }
      el.leftHead.innerHTML = html;
      el.leftHead.scrollLeft = el.leftBody.scrollLeft;
    };

    const colLeft = (c) => { let x = 0; for (let k = 0; k < c; k++) x += colWidth(COLUMNS[k]); return x; };
    // retrait du nom selon le niveau (24 px par niveau) ;
    // le bouton réduire/déployer est juste à gauche du nom (dans la marge pour le niveau 1)
    const GUTTER = 28, INDENT = 24;
    const indentOf = (t) => (t.level - 1) * INDENT;
    const twistyLeft = () => -14;
    const labelLeft = () => 4;

    /* ---------- Filtres : une recherche texte par colonne ---------- */
    // « label » cherche dans le nom des tâches ; les autres clés sont celles des colonnes
    const FILTER_COLS = ["label", "responsable", "heures", "duree", "debut", "fin", "avancement"];
    let filters = {}, showFilters = false;
    const keepVisible = new Set();   // tâches ajoutées pendant un filtrage : restent visibles
    const normTxt = (v) => String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    const filterActive = () => FILTER_COLS.some((k) => normTxt(filters[k]));
    const matches = (t) => FILTER_COLS.every((k) => {
      const q = normTxt(filters[k]);
      if (!q) return true;
      const text = k === "label" ? t.label : cellDisplay(t, k).text;
      return normTxt(text).includes(q);
    });
    let filterCtx = new Set();   // tâches mères affichées seulement pour situer une tâche trouvée

    /* ---------- Lignes visibles (groupes réduits masqués, filtres) ---------- */
    let vis = [], visPos = [];   // vis : indices des tâches affichées ; visPos[r] : rang affiché (-1 si masquée)
    const refreshVis = () => {
      vis = []; visPos = new Array(p.tasks.length).fill(-1);
      filterCtx = new Set();
      if (filterActive()) {
        // tâches trouvées + leurs tâches mères (pour garder la hiérarchie lisible)
        const show = new Set();
        p.tasks.forEach((t, r) => {
          if (!matches(t) && !keepVisible.has(t.id)) return;
          show.add(r);
          let lvl = t.level;
          for (let k = r - 1; k >= 0 && lvl > 1; k--) {
            if (p.tasks[k].level < lvl) { if (!show.has(k)) filterCtx.add(k); show.add(k); lvl = p.tasks[k].level; }
          }
        });
        filterCtx.forEach((k) => { if (matches(p.tasks[k])) filterCtx.delete(k); });
        p.tasks.forEach((t, r) => { if (show.has(r)) { visPos[r] = vis.length; vis.push(r); } });
        return;
      }
      for (let r = 0; r < p.tasks.length; ) {
        visPos[r] = vis.length;
        vis.push(r);
        const t = p.tasks[r];
        r = t.collapsed && Task.isParent(t) ? Tree.blockEnd(p, r) : r + 1;
      }
    };
    // ligne affichée voisine (d = -1 au-dessus, +1 en dessous)
    const stepRow = (r, d) => vis[Math.max(0, Math.min(vis.length - 1, (visPos[r] < 0 ? 0 : visPos[r]) + d))];

    // flèches grises qui relient chaque tâche à sa tâche mère (niveau supérieur le plus proche au-dessus)
    const treeSVG = () => {
      let paths = "";
      vis.forEach((r) => {
        const t = p.tasks[r];
        if (t.level === 1) return;
        let pr = r - 1;
        while (pr >= 0 && p.tasks[pr].level >= t.level) pr--;
        if (pr < 0) return;
        const x = GUTTER + indentOf(p.tasks[pr]) + twistyLeft() + 6;
        const y0 = visPos[pr] * rowH + rowH / 2 + 6, y = visPos[r] * rowH + rowH / 2;
        // la flèche s'arrête juste avant le bouton (tâche mère) ou le libellé (tâche simple)
        const x2 = GUTTER + indentOf(t) + (Task.isParent(t) ? twistyLeft() - 1 : labelLeft() - 2);
        paths += `<path class="tree-line" d="M${x} ${y0} V${y - 3} Q${x} ${y} ${x + 3} ${y} H${x2}" marker-end="url(#tree-arrow)"/>`;
      });
      if (!paths) return "";
      return `<svg class="tree-svg" width="${GUTTER + colLeft(COL.label + 1)}" height="${vis.length * rowH}"><defs><marker id="tree-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>${paths}</svg>`;
    };
    const CHEVRON = '<svg viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    // nombre de colonnes Niv suivantes (toujours vides sur cette ligne) sur lesquelles s'étend le libellé
    const commentPreview = (t) => { const c = (t.comment || "").trim(); return c.length > 300 ? c.slice(0, 300) + "…" : c; };
    // fenêtre des commentaires de la tâche r (double-clic sur le nom ou sur la barre)
    const openComments = (r) => {
      const t = p.tasks[r];
      if (!t) return;
      if (editor) editor.input.blur();
      commentDialog(t, (text) => {
        if (text === (t.comment || "")) return;
        mutate(() => { if (text) t.comment = text; else delete t.comment; });
      });
    };

    const renderRows = () => {
      Tree.compute(p);
      refreshVis();
      const R = rect();
      el.leftBody.innerHTML = p.tasks.length && !vis.length
        ? `<div class="table-empty">Aucune tâche ne correspond aux filtres.</div>`
        : p.tasks.length
        ? vis.map((r) => {
            const t = p.tasks[r];
            const inRows = R && r >= R.r1 && r <= R.r2;
            const parent = Task.isParent(t);
            return `<div class="trow${inRows ? " row-sel" : ""}${filterCtx.has(r) ? " filter-context" : ""}">${COLUMNS.map((c, i) => {
              const d = cellDisplay(t, c.key);
              let content = esc(d.text), spillCls = "";
              let style = `width:${colWidth(c)}px`;
              if (i === COL.label) {
                // nom placé selon son niveau ; il s'arrête au bord de la colonne Tâche
                const left = indentOf(t) + labelLeft(t);
                const cmt = t.comment ? `<span class="cmt-ico" title="${esc(commentPreview(t))}">${ICONS.comment}</span>` : "";
                content = `<span class="spill-text" style="left:${left}px;width:${Math.max(0, colWidth(c) - left - 6)}px"><span class="lbl">${content}</span>${cmt}</span>`;
                if (parent) {
                  spillCls = "spill-from";   // le bouton dépasse à gauche de la cellule (niveau 1)
                  content = `<span class="twisty${t.collapsed ? " closed" : ""}" data-r="${r}" style="left:${indentOf(t) + twistyLeft(t)}px" title="${t.collapsed ? "Déployer" : "Réduire"} le groupe">${CHEVRON}</span>` + content;
                }
              }
              const cls = ["tcell", c.align || "", c.compact ? "compact" : "",
                d.invalid ? "invalid" : "", d.calc ? "calc" : "",
                isTaskCol(i) && t.level === 1 ? "lvl1" : "",
                inRows && i >= R.c1 && i <= R.c2 && (R.r1 !== R.r2 || R.c1 !== R.c2) ? "in-range" : "",
                sel && sel.r === r && sel.c === i ? "sel" : "", spillCls].join(" ");
              const grip = i === 0 ? `<span class="grip" data-r="${r}" title="Glisser pour déplacer la tâche (avec ses sous-tâches)"></span>` : "";
              const tip = d.formulaError ? ' title="Formule incorrecte"' : d.invalid ? ' title="Valeur non numérique : le calcul est bloqué"' : d.calc ? ' title="Calculé à partir des tâches filles"' : "";
              return `<div class="${cls}" data-r="${r}" data-c="${i}" style="${style}"${tip}>${grip}${content}</div>`;
            }).join("")}</div>`;
          }).join("") + treeSVG()
        : `<div class="table-empty">Aucune tâche. Cliquez sur « Ajouter une tâche » pour commencer.</div>`;
      el.del.disabled = !sel;
    };

    const renderAll = () => { renderTableHead(); renderRows(); renderGantt(); };

    const filterBtn = root.querySelector('[data-act="filter"]');
    const paintFilterBtn = () => {
      const n = FILTER_COLS.filter((k) => normTxt(filters[k])).length;
      filterBtn.classList.toggle("on", showFilters);
      const badge = filterBtn.querySelector(".badge");
      badge.hidden = !n;
      badge.textContent = n;
      el.page.style.setProperty("--head-h", showFilters ? "101px" : "72px");
    };
    const applyFilters = () => {
      keepVisible.clear();
      renderRows(); renderGantt();
      if (sel && visPos[sel.r] < 0) { sel = null; renderRows(); }
      paintFilterBtn();
    };
    filterBtn.addEventListener("click", () => {
      showFilters = !showFilters;
      if (!showFilters) filters = {};   // fermer la ligne de filtres les efface
      renderTableHead(); applyFilters();
      if (showFilters) el.leftHead.querySelector(".filter-input").focus();
    });
    el.leftHead.addEventListener("input", (e) => {
      const inp = e.target.closest(".filter-input");
      if (!inp) return;
      filters[inp.dataset.k] = inp.value;
      inp.classList.toggle("active", !!normTxt(inp.value));
      applyFilters();
    });
    el.leftHead.addEventListener("keydown", (e) => {
      const inp = e.target.closest(".filter-input");
      if (!inp) return;
      e.stopPropagation();
      if (e.key === "Escape") { filters[inp.dataset.k] = ""; renderTableHead(); applyFilters(); }
      if (e.key === "Enter") el.leftBody.focus({ preventScroll: true });
    });
    el.leftHead.addEventListener("click", (e) => {
      const b = e.target.closest("[data-clear]");
      if (!b) return;
      filters[b.dataset.clear] = "";
      renderTableHead(); applyFilters();
    });

    const cellEl = (r, c) => el.leftBody.querySelector(`.tcell[data-r="${r}"][data-c="${c}"]`);

    const ensureVisible = (r, c) => {
      const cell = cellEl(r, c);
      if (!cell) return;
      const top = Math.max(0, visPos[r]) * rowH, bottom = top + rowH, vb = el.rightBody;
      if (top < vb.scrollTop) vb.scrollTop = top;
      else if (bottom > vb.scrollTop + vb.clientHeight) vb.scrollTop = bottom - vb.clientHeight;
      const lb = el.leftBody;
      if (cell.offsetLeft < lb.scrollLeft) lb.scrollLeft = cell.offsetLeft;
      else if (cell.offsetLeft + cell.offsetWidth > lb.scrollLeft + lb.clientWidth) lb.scrollLeft = cell.offsetLeft + cell.offsetWidth - lb.clientWidth;
    };

    const clampR = (r) => Math.max(0, Math.min(p.tasks.length - 1, r));
    const clampC = (c) => Math.max(0, Math.min(COLUMNS.length - 1, c));

    const select = (r, c, extend = false) => {
      if (!p.tasks.length) { sel = null; renderRows(); highlightGantt(); return; }
      r = clampR(r); c = clampC(c);
      Tree.compute(p); refreshVis();
      while (r > 0 && visPos[r] < 0) r--;   // ligne masquée : on remonte à sa tâche mère
      if (extend && sel) { sel.r2 = r; sel.c2 = c; }
      else sel = { r, c, r2: r, c2: c };
      renderRows();
      highlightGantt();
      ensureVisible(extend ? sel.r2 : sel.r, extend ? sel.c2 : sel.c);
    };

    const deselect = () => {
      if (!sel) return;
      if (editor) editor.input.blur();
      sel = null;
      renderRows();
      highlightGantt();
    };
    // clic ailleurs que sur une cellule (bas vide du tableau, fond du planning, en-têtes…) : plus de cellule sélectionnée
    // (les boutons des barres d'outils, les barres du planning et les fenêtres gardent la sélection)
    on(document, "pointerdown", (e) => {
      if (!sel || e.button !== 0) return;
      if (e.target.closest(".pane-left .pane-body .tcell[data-r], .topbar button, .toolbar button, .bar, .link-hit, .modal-backdrop, .settings-panel, .cal-pop")) return;
      deselect();
    });

    // applique une modification à des tâches puis met à jour liens, affichage et sauvegarde
    const mutate = (fn) => {
      Tree.compute(p);
      const before = new Map(p.tasks.map((t) => [t, Task.end(t)]));
      fn();
      Links.afterChange(p, before);
      save();
      renderRows();
      renderGantt();
    };

    /* ---------- Calendrier des colonnes Date début / Date fin ---------- */
    // s'affiche sous la cellule en cours de saisie ; un clic sur un jour remplit la date, la saisie au clavier reste possible
    const openCalendar = (input, cell, onPick) => {
      const pop = document.createElement("div");
      pop.className = "cal-pop";
      const view = Dates.parseISO(Dates.parseFR(input.value) || todayISO());
      view.setDate(1);
      const render = () => {
        const y = view.getFullYear(), m = view.getMonth(), today = todayISO(), chosen = Dates.parseFR(input.value);
        const offset = (new Date(y, m, 1, 12).getDay() + 6) % 7, count = new Date(y, m + 1, 0).getDate();
        let days = "<span></span>".repeat(offset);
        for (let d = 1; d <= count; d++) {
          const date = new Date(y, m, d, 12), iso = Dates.toISO(date);
          const cls = [Dates.isWeekend(date) ? "we" : "", iso === today ? "today" : "", iso === chosen ? "chosen" : ""].join(" ");
          days += `<button type="button" class="${cls}" data-iso="${iso}">${d}</button>`;
        }
        const title = view.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
        pop.innerHTML = `
          <div class="cal-head">
            <button type="button" data-nav="-1" aria-label="Mois précédent">‹</button>
            <span>${title}</span>
            <button type="button" data-nav="1" aria-label="Mois suivant">›</button>
          </div>
          <div class="cal-grid">${["L", "M", "M", "J", "V", "S", "D"].map((d) => `<b>${d}</b>`).join("")}${days}</div>
          <div class="cal-foot"><button type="button" data-today>Aujourd'hui</button></div>`;
      };
      pop.addEventListener("mousedown", (e) => e.preventDefault());   // la saisie garde le focus
      pop.addEventListener("click", (e) => {
        const nav = e.target.closest("[data-nav]"), day = e.target.closest("[data-iso]");
        if (nav) { view.setMonth(view.getMonth() + Number(nav.dataset.nav)); render(); }
        else if (day) { input.value = Dates.format(day.dataset.iso); onPick(); }
        else if (e.target.closest("[data-today]")) { input.value = Dates.format(todayISO()); onPick(); }
      });
      // une date tapée au clavier fait suivre le calendrier
      input.addEventListener("input", () => {
        const iso = Dates.parseFR(input.value);
        if (iso) { const d = Dates.parseISO(iso); view.setFullYear(d.getFullYear(), d.getMonth(), 1); }
        render();
      });
      render();
      document.body.appendChild(pop);
      const r = cell.getBoundingClientRect(), h = pop.offsetHeight, w = pop.offsetWidth;
      pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
      pop.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 4 : r.bottom + 4) + "px";
      return pop;
    };

    /* ---------- Saisie dans une cellule ---------- */
    // fromClick : ouvert par un clic simple sur le nom de la tâche
    const openEditor = (initial, fromClick = false) => {
      if (!sel || editor) return;
      if (Task.isParent(p.tasks[sel.r]) && CALC_KEYS.includes(COLUMNS[sel.c].key)) {
        toast("Valeur calculée à partir des tâches filles");
        return;
      }
      sel.r2 = sel.r; sel.c2 = sel.c;
      renderRows();
      const cell = cellEl(sel.r, sel.c);
      const t = p.tasks[sel.r], key = COLUMNS[sel.c].key;
      const input = document.createElement("input");
      input.className = "cell-editor " + (COLUMNS[sel.c].align || "");
      // valeur modifiable : le calcul « = » s'il y en a un, sinon le texte affiché
      const editValue = () => (key === "avancement" ? t.avancement || "" : key === "heures" ? String(t.heures ?? "")
        : key === "duree" && t.dureeFormula ? t.dureeFormula : cellDisplay(t, key).text);
      input.value = initial != null ? initial : editValue();
      if (key === "label") input.style.paddingLeft = indentOf(t) + labelLeft() - 2 + "px";   // le texte reste à sa place (retrait du niveau)
      cell.textContent = "";
      cell.classList.remove("invalid");
      cell.appendChild(input);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      editor = { input, done: false, fromClick, orig: input.value };
      // Date début / Date fin : calendrier (sauf si la saisie a commencé par une touche)
      const cal = initial == null && (key === "debut" || key === "fin") ? openCalendar(input, cell, () => finish(true)) : null;

      const finish = (commit, after) => {
        if (!editor || editor.done) return;
        editor.done = true;
        editor = null;
        if (cal) cal.remove();
        if (commit && input.value !== editValue()) mutate(() => commitCell(t, key, input.value));
        else renderRows();
        if (after) after();
        el.leftBody.focus({ preventScroll: true });
      };
      input.addEventListener("keydown", (e) => {
        // nom ouvert par un simple clic et pas encore modifié : Suppr, copier / coller, annuler, Alt + ↑ / ↓
        // agissent sur la tâche comme si la cellule était seulement sélectionnée
        const k = e.key.toLowerCase();
        if (editor && editor.fromClick && input.value === editor.orig &&
            (e.key === "Delete" || ((e.ctrlKey || e.metaKey) && "cxvzy".includes(k)) || (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")))) {
          finish(false);   // l'événement continue jusqu'au tableau
          return;
        }
        e.stopPropagation();
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); finish(true); saveNow(); }
        else if (e.key === "Enter") { e.preventDefault(); finish(true, () => select(stepRow(sel.r, e.shiftKey ? -1 : 1), sel.c)); }
        else if (e.key === "Escape") { e.preventDefault(); finish(false); }
        else if (e.key === "Tab") {
          e.preventDefault();
          if (isTaskCol(sel.c)) finish(true, () => indent(e.shiftKey ? -1 : 1));
          else finish(true, () => select(sel.r, sel.c + (e.shiftKey ? -1 : 1)));
        }
        else if (e.key === "ArrowUp") { e.preventDefault(); finish(true, () => select(stepRow(sel.r, -1), sel.c)); }
        else if (e.key === "ArrowDown") { e.preventDefault(); finish(true, () => select(stepRow(sel.r, 1), sel.c)); }
      });
      input.addEventListener("blur", () => finish(true));
    };

    /* ---------- Niveaux : Tab = descendre d'un niveau, Maj+Tab = remonter ---------- */
    const indent = (delta) => {
      if (!sel) return;
      const R = rect();
      const tasks = p.tasks.slice(R.r1, R.r2 + 1);
      mutate(() => tasks.forEach((t) => { t.level = Math.max(1, Math.min(MAX_LEVEL, t.level + delta)); }));
    };

    /* ---------- Souris : sélection d'une cellule ou d'une plage ---------- */
    let dragSel = false;
    // fin du bloc d'une tâche = elle + les lignes suivantes de niveau inférieur (ses sous-tâches)
    const blockEnd = (r) => Tree.blockEnd(p, r);

    const startRowDrag = (e, r) => {
      if (filterActive()) { toast("Effacez les filtres pour déplacer des tâches"); return; }
      if (editor) editor.input.blur();
      const end = blockEnd(r);
      for (let k = r; k < end; k++) el.leftBody.querySelector(`.tcell[data-r="${k}"]`)?.parentElement.classList.add("moving");
      const line = document.createElement("div");
      line.className = "drop-line";
      line.style.display = "none";
      line.style.width = el.leftBody.scrollWidth + "px";
      el.leftBody.appendChild(line);
      document.body.classList.add("row-dragging");
      let target = null, scrollTimer = null, lastY = e.clientY;

      const update = () => {
        const box = el.leftBody.getBoundingClientRect();
        const y = lastY - box.top + el.leftBody.scrollTop;
        const pos = Math.max(0, Math.min(vis.length, Math.round(y / rowH)));
        target = pos < vis.length ? vis[pos] : p.tasks.length;
        const inside = target >= r && target <= end;   // dans son propre bloc : rien ne bouge
        line.style.display = inside ? "none" : "block";
        line.style.top = pos * rowH + "px";
        if (inside) target = null;
      };
      const autoScroll = () => {
        const box = el.leftBody.getBoundingClientRect();
        const edge = 30;
        if (lastY < box.top + edge) el.rightBody.scrollTop -= 12;
        else if (lastY > box.bottom - edge) el.rightBody.scrollTop += 12;
        else return;
        update();
      };
      const move = (ev) => { lastY = ev.clientY; update(); };
      const up = () => {
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
        clearInterval(scrollTimer);
        document.body.classList.remove("row-dragging");
        line.remove();
        if (target == null) { renderRows(); return; }
        const at = target > r ? target - (end - r) : target;
        sel = null;
        let block;
        mutate(() => {
          block = p.tasks.splice(r, end - r);
          p.tasks.splice(at, 0, ...block);
        });
        select(at, COL.label);
        el.leftBody.focus({ preventScroll: true });
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      scrollTimer = setInterval(autoScroll, 30);
    };

    // Tout développer / Tout réduire : groupe de la tâche sélectionnée (elle-même si c'est une tâche mère,
    // sinon sa tâche mère) et tous ses sous-groupes ; tout le projet si rien n'est sélectionné
    const setAllGroups = (collapsed) => {
      if (editor) editor.input.blur();
      Tree.compute(p);
      let from = 0, to = p.tasks.length;
      if (sel) {
        let r = sel.r;
        if (!Task.isParent(p.tasks[r])) {
          let pr = r - 1;
          while (pr >= 0 && p.tasks[pr].level >= p.tasks[r].level) pr--;
          r = pr;
        }
        if (r >= 0) { from = r; to = Tree.blockEnd(p, r); }
      }
      let changed = 0;
      for (let k = from; k < to; k++) {
        const t = p.tasks[k];
        if (Task.isParent(t) && !!t.collapsed !== collapsed) { t.collapsed = collapsed; changed++; }
      }
      if (!changed) { toast(collapsed ? "Déjà tout réduit" : "Déjà tout développé"); return; }
      save();
      renderRows(); renderGantt();
      if (sel && visPos[sel.r] < 0) select(sel.r, sel.c); else highlightGantt();
    };
    root.querySelector('[data-act="expand-all"]').addEventListener("click", () => setAllGroups(false));
    root.querySelector('[data-act="collapse-all"]').addEventListener("click", () => setAllGroups(true));

    const toggleGroup = (r) => {
      const t = p.tasks[r];
      t.collapsed = !t.collapsed;
      save();
      renderRows(); renderGantt();
      if (sel && visPos[sel.r] < 0) select(r, sel.c);
    };

    el.leftBody.addEventListener("mousedown", (e) => {
      const tw = e.target.closest(".twisty");
      if (tw && e.button === 0) { e.preventDefault(); if (editor) editor.input.blur(); toggleGroup(+tw.dataset.r); return; }
      const grip = e.target.closest(".grip");
      if (grip && e.button === 0) { e.preventDefault(); startRowDrag(e, +grip.dataset.r); return; }
      const cell = e.target.closest(".tcell[data-r]");
      clearTimeout(clickEdit);
      // 2e clic arrivé après l'ouverture du nom en modification : c'est un double-clic → commentaires
      if (e.target.classList.contains("cell-editor") && e.detail === 2 && editor && editor.fromClick && editor.input.value === editor.orig) {
        e.preventDefault();
        const r = sel.r;
        editor.input.blur();
        openComments(r);
        return;
      }
      if (!cell || e.target.classList.contains("cell-editor") || e.button !== 0) return;
      e.preventDefault();
      if (editor) editor.input.blur();
      const r = +cell.dataset.r, c = +cell.dataset.c;
      // double-clic (détecté ici car le tableau est redessiné entre les deux clics) :
      // nom de la tâche → commentaires ; autres cellules → modifier (dates : calendrier)
      if (e.detail >= 2 && !e.shiftKey && sel && sel.r === r && sel.c === c) {
        if (isTaskCol(c)) openComments(r); else openEditor();
        return;
      }
      select(r, c, e.shiftKey);
      dragSel = true;
      // clic simple sur le nom : modification après un court instant (annulée par un double-clic ou une sélection étendue)
      pendingEdit = isTaskCol(c) && !e.shiftKey && e.detail === 1 ? { r, c } : null;
      el.leftBody.focus({ preventScroll: true });
    });
    let pendingEdit = null, clickEdit = null;
    el.leftBody.addEventListener("mouseover", (e) => {
      if (!dragSel || !sel) return;
      const cell = e.target.closest(".tcell[data-r]");
      if (!cell) return;
      const r = +cell.dataset.r, c = +cell.dataset.c;
      if (r !== sel.r2 || c !== sel.c2) select(r, c, true);
    });
    on(window, "mouseup", () => {
      dragSel = false;
      const pe = pendingEdit;
      pendingEdit = null;
      const same = () => sel && sel.r === pe.r && sel.c === pe.c && sel.r2 === pe.r && sel.c2 === pe.c;
      if (pe && same()) clickEdit = setTimeout(() => { if (!editor && same() && !document.querySelector(".modal-backdrop")) openEditor(undefined, true); }, 280);
    });
    cleanups.push(() => clearTimeout(clickEdit));

    /* ---------- Clavier ---------- */
    // Alt + ↑ / ↓ : la tâche (avec ses sous-tâches) passe au-dessus / en dessous de la tâche voisine du même groupe
    const moveTask = (dir) => {
      if (filterActive()) { toast("Effacez les filtres pour déplacer des tâches"); return; }
      const r = sel.r, c = sel.c, t = p.tasks[r], end = blockEnd(r);
      let at;
      if (dir < 0) {
        let q = r - 1;
        while (q >= 0 && p.tasks[q].level > t.level) q--;
        if (q < 0 || p.tasks[q].level < t.level) { toast("La tâche est déjà la première de son groupe"); return; }
        at = q;
      } else {
        if (end >= p.tasks.length || p.tasks[end].level < t.level) { toast("La tâche est déjà la dernière de son groupe"); return; }
        at = blockEnd(end) - (end - r);
      }
      sel = null;
      mutate(() => {
        const block = p.tasks.splice(r, end - r);
        p.tasks.splice(at, 0, ...block);
      });
      select(at, c);
    };

    el.leftBody.addEventListener("keydown", (e) => {
      if (editor || !sel) return;
      if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
        e.preventDefault();
        moveTask(e.key === "ArrowUp" ? -1 : 1);
        return;
      }
      const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
      if (moves[e.key]) {
        e.preventDefault();
        const [dr, dc] = moves[e.key];
        if (e.shiftKey) select(dr ? stepRow(sel.r2, dr) : sel.r2, sel.c2 + dc, true);
        else select(dr ? stepRow(sel.r, dr) : sel.r, sel.c + dc);
        return;
      }
      if (e.key === "Tab") {
        e.preventDefault();
        // Tab / Maj+Tab changent le niveau uniquement depuis une colonne Niv ; ailleurs, ils passent à la cellule voisine
        if (isTaskCol(sel.c)) indent(e.shiftKey ? -1 : 1);
        else select(sel.r, sel.c + (e.shiftKey ? -1 : 1));
        return;
      }
      if (e.key === "Enter" || e.key === "F2") { e.preventDefault(); openEditor(); return; }
      if (e.key === "Delete") {
        e.preventDefault();
        if (isTaskCol(sel.c)) deleteSelection(); else clearRange();   // colonne Tâche : la tâche ; ailleurs : le contenu
        return;
      }
      if (e.key === "Backspace") { e.preventDefault(); clearRange(); return; }
      if (e.key === "Escape") { select(sel.r, sel.c); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") {
        e.preventDefault();
        sel = { r: 0, c: 0, r2: p.tasks.length - 1, c2: COLUMNS.length - 1 };
        renderRows(); highlightGantt();
        return;
      }
      // une touche de caractère commence la saisie (comme Excel)
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openEditor(e.key); }
    });

    const clearRange = () => {
      const R = rect();
      const tasks = p.tasks.slice(R.r1, R.r2 + 1);
      mutate(() => tasks.forEach((t) => {
        for (let c = R.c1; c <= R.c2; c++) commitCell(t, COLUMNS[c].key, "");
      }));
    };

    /* ---------- Copier / couper / coller (compatible Excel) ---------- */
    const tableFocused = () => document.activeElement === el.leftBody && sel && !editor;
    const copyRange = (e) => {
      const R = rect();
      const lines = [];
      for (let r = R.r1; r <= R.r2; r++) {
        const cells = [];
        for (let c = R.c1; c <= R.c2; c++) {
          // la colonne Tâche part dans Excel sur ses colonnes de niveau (4 au moins, une par niveau utilisé)
          const keys = isTaskCol(c) ? xlKeys(levelCount(p)).slice(0, levelCount(p)) : [COLUMNS[c].key];
          keys.forEach((k) => cells.push(toTSVCell(cellDisplay(p.tasks[r], k).text)));
        }
        lines.push(cells.join("\t"));
      }
      e.clipboardData.setData("text/plain", lines.join("\r\n"));
      e.preventDefault();
    };
    on(document, "copy", (e) => { if (tableFocused()) { copyRange(e); toast("Cellules copiées"); } });
    on(document, "cut", (e) => { if (tableFocused()) { copyRange(e); clearRange(); } });
    on(document, "paste", (e) => {
      if (!tableFocused()) return;
      e.preventDefault();
      let data = parseTSV(e.clipboardData.getData("text/plain"));
      if (!data.length) return;
      const R = rect();
      // une seule valeur collée sur une plage : elle remplit toute la plage
      if (data.length === 1 && data[0].length === 1 && (R.r1 !== R.r2 || R.c1 !== R.c2)) {
        data = Array.from({ length: R.r2 - R.r1 + 1 }, () => Array(R.c2 - R.c1 + 1).fill(data[0][0]));
      }
      const r0 = R.r1, c0 = R.c1;
      // colonnes collées : à partir de la colonne Tâche, des données d'au moins 4 colonnes sont lues
      // comme dans Excel (colonnes de niveau du projet puis Responsable…) ; sinon colonne par colonne
      const dataW = Math.max(...data.map((row) => row.length));
      const xl = isTaskCol(c0) && dataW >= 4;
      const keys = (xl ? xlKeys(levelCount(p)) : COLUMNS.slice(c0).map((c) => c.key)).slice(0, dataW);
      const width = keys.length;
      const pasted = (key) => keys.includes(key);
      // lignes affichées à partir de la sélection ; ajoute les lignes manquantes en fin de tableau
      const pos0 = Math.max(0, visPos[r0]);
      const tasks = data.map((_, i) => {
        const r = vis[pos0 + i];
        if (r != null) return p.tasks[r];
        const t = Task.create(1);
        p.tasks.push(t);
        return t;
      });
      mutate(() => data.forEach((row, i) => {
        const t = tasks[i];
        for (let j = 0; j < width; j++) {
          const key = keys[j];
          // Durée et Date fin sont recalculées si Heures est collée en même temps
          if (key === "duree" && pasted("heures")) continue;
          if (key === "fin" && (pasted("heures") || pasted("duree"))) continue;
          // une Date début vide dans les cellules collées ne supprime pas la date existante
          if (key === "debut" && !String(row[j] ?? "").trim()) continue;
          commitCell(t, key, row[j] ?? "");
        }
      }));
      const lastKey = keys[width - 1];
      sel = { r: r0, c: c0, r2: p.tasks.indexOf(tasks[tasks.length - 1]), c2: /^niv/.test(lastKey) ? COL.label : COL[lastKey] };
      renderRows(); highlightGantt();
      toast(`${data.length} ligne${data.length > 1 ? "s" : ""} collée${data.length > 1 ? "s" : ""}`);
    });

    /* ---------- Ajouter / supprimer des tâches ---------- */
    root.querySelector('[data-act="add"]').addEventListener("click", () => {
      if (editor) editor.input.blur();
      const R = rect();
      // une nouvelle tâche se place après le groupe de la tâche sélectionnée (pas au milieu de ses filles)
      const at = R ? Tree.blockEnd(p, R.r2) : p.tasks.length;
      // pendant un filtrage, la nouvelle tâche reste visible même si elle ne correspond pas aux filtres
      const added = () => keepVisible.add(p.tasks[at].id);
      const level = R ? p.tasks[R.r2].level : 1;
      p.tasks.splice(at, 0, Task.create(level));
      added();
      save();
      renderAll();
      select(at, COL.label);
      el.leftBody.focus({ preventScroll: true });
    });
    // supprime les tâches sélectionnées (bouton Supprimer ou touche Suppr), après confirmation
    const deleteSelection = async () => {
      if (!sel) return;
      const R = rect();
      let end = R.r2 + 1;
      for (let r = R.r1; r <= R.r2; r++) if (p.tasks[r].collapsed && Task.isParent(p.tasks[r])) end = Math.max(end, Tree.blockEnd(p, r));
      const victims = p.tasks.slice(R.r1, end);
      const one = victims.length === 1;
      const ok = await confirmDialog({
        title: one ? "Supprimer cette tâche ?" : `Supprimer ces ${victims.length} tâches ?`,
        message: one
          ? `« ${victims[0].label || "(sans nom)"} » et ses liens seront supprimés. Ctrl + Z permet d'annuler.`
          : "Les lignes sélectionnées et leurs liens seront supprimés. Ctrl + Z permet d'annuler.",
        okLabel: "Oui", cancelLabel: "Non", danger: true, focusOk: true,
      });
      if (!ok) { el.leftBody.focus({ preventScroll: true }); return; }
      const ids = new Set(victims.map((t) => t.id));
      p.tasks.splice(R.r1, victims.length);
      p.links = p.links.filter((l) => !ids.has(l.from) && !ids.has(l.to));
      save();
      sel = null;
      renderAll();
      if (p.tasks.length) select(Math.min(R.r1, p.tasks.length - 1), sel ? sel.c : 0);
      el.leftBody.focus({ preventScroll: true });
    };
    el.del.addEventListener("click", deleteSelection);

    /* ---------- Largeur des colonnes ---------- */
    el.leftHead.addEventListener("pointerdown", (e) => {
      const h = e.target.closest(".col-resize");
      if (!h) return;
      e.preventDefault();
      const col = COLUMNS[+h.dataset.c];
      const startX = e.clientX, startW = colWidth(col);
      h.setPointerCapture(e.pointerId);
      document.body.classList.add("resizing");
      const move = (ev) => {
        p.ui.colWidths = p.ui.colWidths || {};
        p.ui.colWidths[col.key] = Math.max(MIN_COL, Math.round(startW + ev.clientX - startX));
        el.leftHead.querySelectorAll(".tcell")[+h.dataset.c].style.width = p.ui.colWidths[col.key] + "px";
        renderRows();
      };
      const up = () => {
        h.removeEventListener("pointermove", move);
        document.body.classList.remove("resizing");
        Store.save();
      };
      h.addEventListener("pointermove", move);
      h.addEventListener("pointerup", up, { once: true });
    });
    el.leftHead.addEventListener("dblclick", (e) => {
      const h = e.target.closest(".col-resize");
      if (!h || !p.ui.colWidths) return;
      delete p.ui.colWidths[COLUMNS[+h.dataset.c].key];
      Store.save();
      renderTableHead(); renderRows();
    });

    /* ========================================================
       PLANNING GANTT
       ======================================================== */
    let dw = ZOOMS.includes(p.ui.zoom) ? p.ui.zoom : DEFAULT_ZOOM;   // largeur d'un jour en pixels
    let range = { start: todayISO(), days: 0 };

    const dayX = (iso) => Dates.diffDays(range.start, iso) * dw;

    const computeRange = () => {
      let min = todayISO(), max = todayISO();
      p.tasks.forEach((t) => {
        const st = Task.start(t);
        if (!st) return;
        if (st < min) min = st;
        const e = Task.end(t) || st;
        if (e > max) max = e;
      });
      const start = Dates.mondayOf(Dates.addDays(min, -28));
      let days = Dates.diffDays(start, Dates.addDays(max, 180));
      days = Math.max(days, Math.ceil((el.rightBody.clientWidth || 1200) / dw) + 14);
      days = Math.ceil(days / 7) * 7;
      range = { start, days };
    };

    const renderGanttHead = () => {
      const s = Dates.parseISO(range.start), today = todayISO();
      const segs = { years: [], months: [], weeks: [] };
      const push = (arr, key, i, label) => {
        const last = arr[arr.length - 1];
        if (last && last.key === key) last.n++; else arr.push({ key, i, n: 1, label });
      };
      let days = "";
      for (let i = 0; i < range.days; i++) {
        const d = new Date(s.getFullYear(), s.getMonth(), s.getDate() + i, 12);
        const iso = Dates.toISO(d);
        push(segs.years, d.getFullYear(), i, String(d.getFullYear()));
        push(segs.months, d.getFullYear() * 12 + d.getMonth(), i, d);
        push(segs.weeks, Dates.mondayOf(iso), i, d);
        const cls = (Dates.isWeekend(d) ? " we" : "") + (iso === today ? " today" : "");
        days += `<div class="gh-cell${cls}" style="left:${i * dw}px;width:${dw}px">${dw >= 16 ? d.getDate() : ""}</div>`;
      }
      const cells = (arr, fmt) => arr.map((sg) => `<div class="gh-cell" style="left:${sg.i * dw}px;width:${sg.n * dw}px"><span class="stick">${fmt(sg)}</span></div>`).join("");
      const monthFmt = (sg) => {
        const w = sg.n * dw;
        if (w < 28) return "";
        return sg.label.toLocaleDateString("fr-FR", { month: w > 90 ? "long" : "short" });
      };
      const weekFmt = (sg) => {
        const w = sg.n * dw;
        if (w < 26) return "";
        const wk = "S" + Dates.isoWeek(sg.label);
        return w >= 100 ? `${wk} · ${sg.label.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}` : wk;
      };
      el.ganttHead.style.width = range.days * dw + "px";
      el.ganttHead.innerHTML = `
        <div class="gh-row years">${cells(segs.years, (sg) => sg.label)}</div>
        <div class="gh-row months">${cells(segs.months, monthFmt)}</div>
        <div class="gh-row weeks">${cells(segs.weeks, weekFmt)}</div>
        <div class="gh-row days">${days}</div>`;
      el.zoomLabel.textContent = dw >= 40 ? "Jours" : dw >= 14 ? "Semaines" : "Mois";
    };

    const barGeom = (start, dur) => {
      const end = Dates.addWorkdays(start, Math.max(dur, 1) - 1);
      return { left: dayX(start), width: (Dates.diffDays(start, end) + 1) * dw };
    };

    const linkPath = (a, b) => {
      const ra = visPos[p.tasks.indexOf(a)], rb = visPos[p.tasks.indexOf(b)];
      const ea = Task.end(a), da = Task.duration(a), db = Task.duration(b), sa = Task.start(a), sb = Task.start(b);
      if (ra == null || rb == null || ra < 0 || rb < 0 || !ea || !sb || db == null) return null;
      const msA = da === 0 && !Task.isParent(a), msB = db === 0 && !Task.isParent(b);
      const x1 = msA ? dayX(sa) + dw / 2 + 8 : dayX(ea) + dw;
      const y1 = ra * rowH + rowH / 2;
      const x2 = msB ? dayX(sb) + dw / 2 - 8 : dayX(sb);
      const y2 = rb * rowH + rowH / 2;
      if (x2 - x1 >= 16) return `M${x1} ${y1} H${x1 + 8} V${y2} H${x2 - 1}`;
      // tâches très proches : la flèche arrive par-dessus (ou par-dessous) la tâche liée
      const wB = msB ? 14 : (Dates.diffDays(sb, Task.end(b)) + 1) * dw;
      const xv = Math.max(x1 + 6, (msB ? dayX(sb) + dw / 2 : x2) + Math.min(10, wB / 2));
      const half = Task.isParent(b) ? (rb > ra ? 4 : 10) : msB ? 6 : barH() / 2;
      const yEnd = rb > ra ? y2 - half - 1 : y2 + half + 1;
      return `M${x1} ${y1} H${xv} V${yEnd}`;
    };

    const renderGantt = () => {
      Tree.compute(p);
      computeRange();
      renderGanttHead();
      refreshVis();
      const W = range.days * dw, H = vis.length * rowH;
      const R = rect();
      const rows = vis.map((r) => {
        const t = p.tasks[r];
        const d = Task.duration(t), st = Task.start(t), parent = Task.isParent(t);
        let bar = "";
        if (d != null && st) {
          const g = parent ? { left: dayX(st), width: (Dates.diffDays(st, Task.end(t)) + 1) * dw } : barGeom(st, d);
          const tip = `${t.label || "(sans nom)"}\n${Dates.format(st)} → ${Dates.format(Task.end(t))} · ${d} jour${d > 1 ? "s" : ""} ouvré${d > 1 ? "s" : ""}${parent ? "\nTâche mère : durée = somme des tâches filles, barre = période de ses tâches filles" : ""}`;
          const ms = d === 0 && !parent;
          const left = ms ? g.left + dw / 2 - 7 : g.left + 1;
          const pct = ms || parent ? null : Task.progress(t);
          const prog = pct == null ? "" : `<span class="prog${pct >= 100 ? " full" : ""}" style="width:${pct}%"></span>`;
          bar = `<div class="bar lvl${t.level}${ms ? " ms" : ""}${parent ? " summary" : ""}${pct == null ? "" : " has-prog"}${R && r >= R.r1 && r <= R.r2 ? " sel" : ""}" data-r="${r}" style="left:${left}px;width:${Math.max(g.width - 2, 4)}px" title="${esc(tip + (pct == null ? "" : `\nAvancement : ${fmtNum(pct)} %`) + (t.comment ? `\nCommentaire : ${commentPreview(t)}` : "\nDouble-clic : commentaires"))}">${prog}
            <span class="h-end" title="Glisser pour allonger ou réduire"></span>
            <span class="link-dot" title="Glisser vers une autre tâche pour les lier"></span>${t.comment ? `<span class="cmt-ico">${ICONS.comment}</span>` : ""}</div>`;
        }
        return `<div class="grow${R && r >= R.r1 && r <= R.r2 ? " row-sel" : ""}" data-r="${r}">${bar}</div>`;
      }).join("");
      const links = (p.links || []).map((l, i) => {
        const d = linkPath(Links.byId(p, l.from), Links.byId(p, l.to));
        if (!d) return "";
        const gap = Links.slack(p, l);
        const info = gap ? `Commence ${gap} jour${gap > 1 ? "s" : ""} ouvré${gap > 1 ? "s" : ""} après le plus tôt possible\n` : "";
        return `<path class="link-hit" data-link="${i}" d="${d}"><title>${info}Cliquer pour supprimer ce lien</title></path><path class="link${gap ? " slack" : ""}" d="${d}" marker-end="url(#arrow)"/>`;
      }).join("");
      const today = Dates.diffDays(range.start, todayISO());
      const bg = dw >= 14
        ? `linear-gradient(to right, var(--grid-line) 1px, transparent 1px) 0 0 / ${dw}px 100%,`
        : `linear-gradient(to right, var(--grid-line) 1px, transparent 1px) 0 0 / ${7 * dw}px 100%,`;
      el.canvas.style.width = W + "px";
      el.canvas.style.height = H + "px";
      el.canvas.style.background = `${bg} linear-gradient(to right, transparent ${5 * dw}px, var(--weekend) ${5 * dw}px) 0 0 / ${7 * dw}px 100%`;
      el.canvas.innerHTML = `${rows}
        <div class="today-line" style="left:${today * dw + dw / 2 - 1}px" title="Aujourd'hui"></div>
        <svg class="links-svg" width="${W}" height="${Math.max(H, 1)}">
          <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
          ${links}<path class="ghost" d="" />
        </svg>`;
    };

    const highlightGantt = () => {
      const R = rect();
      el.canvas.querySelectorAll(".grow").forEach((row) => {
        const r = +row.dataset.r, on = !!R && r >= R.r1 && r <= R.r2;
        row.classList.toggle("row-sel", on);
        row.querySelector(".bar")?.classList.toggle("sel", on);
      });
    };

    const scrollToToday = () => {
      el.rightBody.scrollLeft = Math.max(0, dayX(todayISO()) - el.rightBody.clientWidth * 0.25);
    };

    const setZoom = (next, anchorX) => {
      if (next === dw) return;
      const ax = anchorX ?? el.rightBody.clientWidth / 2;
      const dayAtAnchor = (el.rightBody.scrollLeft + ax) / dw;
      dw = next;
      p.ui.zoom = dw;
      Store.save();
      renderGantt();
      el.rightBody.scrollLeft = dayAtAnchor * dw - ax;
    };
    const zoomStep = (dir, anchorX) => {
      const i = ZOOMS.indexOf(dw);
      setZoom(ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, i + dir))], anchorX);
    };
    root.querySelector('[data-act="zoom-in"]').addEventListener("click", () => zoomStep(1));
    root.querySelector('[data-act="zoom-out"]').addEventListener("click", () => zoomStep(-1));
    root.querySelector('[data-act="today"]').addEventListener("click", scrollToToday);
    el.rightBody.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      zoomStep(e.deltaY < 0 ? 1 : -1, e.clientX - el.rightBody.getBoundingClientRect().left);
    }, { passive: false });

    /* ---------- Souris sur le planning : déplacer, allonger, lier ---------- */
    const tip = document.createElement("div");
    tip.className = "drag-tip";
    const showTip = (e, text) => {
      tip.textContent = text;
      if (!tip.isConnected) document.body.appendChild(tip);
      tip.style.left = e.clientX + 14 + "px";
      tip.style.top = e.clientY + 16 + "px";
    };
    cleanups.push(() => tip.remove());

    // double-clic sur le planning, sur la ligne d'une tâche pas encore planifiée : elle est placée à ce jour (1 jour)
    let lastBgClick = { r: -1, time: 0 }, lastBarDown = { r: -1, time: 0 };
    const placeTask = (r, clientX) => {
      const t = p.tasks[r];
      if (!t || Task.isParent(t) || (Task.start(t) && Task.duration(t) != null)) return;
      const x = clientX - el.canvas.getBoundingClientRect().left;
      const iso = Dates.nextWorkday(Dates.addDays(range.start, Math.floor(x / dw)));
      mutate(() => {
        t.start = iso; delete t.debutText; delete t.finText;
        if (Task.duration(t) == null) { Task.setDays(t, 1); delete t.dureeFormula; }
      });
      select(r, sel ? sel.c : 0);
      toast(`« ${t.label || "(sans nom)"} » commence le ${Dates.format(iso)}`);
    };
    el.rightBody.addEventListener("pointerdown", async (e) => {
      if (e.button !== 0) return;
      if (editor) editor.input.blur();
      const hit = e.target.closest(".link-hit");
      if (hit) {
        const l = p.links[+hit.dataset.link];
        const a = Links.byId(p, l.from), b = Links.byId(p, l.to);
        const ok = await confirmDialog({
          title: "Supprimer ce lien ?",
          message: `« ${b.label || "(sans nom)"} » ne dépendra plus de « ${a.label || "(sans nom)"} ».`,
          okLabel: "Supprimer", danger: true,
        });
        if (ok) { p.links.splice(p.links.indexOf(l), 1); save(); renderGantt(); }
        return;
      }
      const bar = e.target.closest(".bar");
      if (!bar) {
        // clic maintenu sur le fond : on fait glisser le planning dans tous les sens
        e.preventDefault();
        const sx = e.clientX, sy = e.clientY, sl = el.rightBody.scrollLeft, st = el.rightBody.scrollTop;
        let panned = false;
        el.rightBody.setPointerCapture(e.pointerId);
        const move = (ev) => {
          const dx = ev.clientX - sx, dy = ev.clientY - sy;
          if (!panned && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
          panned = true;
          el.canvas.classList.add("panning");
          el.rightBody.scrollLeft = sl - dx;
          el.rightBody.scrollTop = st - dy;
        };
        const up = (ev) => {
          el.rightBody.removeEventListener("pointermove", move);
          el.canvas.classList.remove("panning");
          if (!panned) {
            const row = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".grow");
            if (!row) return;
            const r = +row.dataset.r, now = performance.now();
            const dbl = lastBgClick.r === r && now - lastBgClick.time < 450;
            lastBgClick = dbl ? { r: -1, time: 0 } : { r, time: now };
            if (dbl) placeTask(r, ev.clientX);
          }
        };
        el.rightBody.addEventListener("pointermove", move);
        el.rightBody.addEventListener("pointerup", up, { once: true });
        el.rightBody.addEventListener("pointercancel", up, { once: true });
        return;
      }
      e.preventDefault();
      const r = +bar.dataset.r, t = p.tasks[r];
      // double-clic sur la barre : commentaires
      const now = performance.now();
      if (lastBarDown.r === r && now - lastBarDown.time < 450) { lastBarDown = { r: -1, time: 0 }; openComments(r); return; }
      lastBarDown = { r, time: now };
      const dur = Task.duration(t);
      const startMode = e.target.closest(".h-end") ? "resize" : e.target.closest(".link-dot") ? "link" : "move";
      let mode = startMode, moved = false, preview = null, dropRow = null;
      const sx = e.clientX, sy = e.clientY;
      const ghost = el.canvas.querySelector(".ghost");
      const canvasBox = () => el.canvas.getBoundingClientRect();
      bar.setPointerCapture(e.pointerId);
      bar.classList.add("dragging");

      const tStart = Task.start(t), isMs = dur === 0 && !Task.isParent(t);
      const resetBar = () => {
        bar.style.left = (isMs ? dayX(tStart) + dw / 2 - 7 : dayX(tStart) + 1) + "px";   // la largeur ne change pas
      };

      const clearDrop = () => el.page.querySelectorAll(".drop-target, .drop-bad").forEach((n) => n.classList.remove("drop-target", "drop-bad"));
      const onMove = (ev) => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
        moved = true;
        const days = Math.round(dx / dw);
        clearDrop();
        ghost.setAttribute("d", "");
        dropRow = null;

        if (mode === "move") {
          let start = Dates.addDays(tStart, days);
          start = days < 0 ? Dates.prevWorkday(start) : Dates.nextWorkday(start);
          preview = { start };
          bar.style.left = (isMs ? dayX(start) + dw / 2 - 7 : dayX(start) + 1) + "px";
          showTip(ev, `Début : ${Dates.format(start)}`);
        } else if (mode === "resize") {
          let end = Dates.prevWorkday(Dates.addDays(Task.end(t), days));
          if (end < t.start) end = t.start;
          const newDur = Dates.workdaysBetween(t.start, end), heures = Task.hoursFromDays(newDur);
          preview = { days: newDur };
          const g = barGeom(t.start, newDur);
          bar.style.width = Math.max(g.width - 2, 4) + "px";
          showTip(ev, `${newDur} jour${newDur > 1 ? "s" : ""} · ${heures} h · fin ${Dates.format(Dates.addWorkdays(t.start, Math.max(newDur, 1) - 1))}`);
        } else {
          resetBar();
          const box = canvasBox();
          const x = ev.clientX - box.left, y = ev.clientY - box.top;
          const x0 = parseFloat(bar.style.left) + bar.offsetWidth, y0 = visPos[r] * rowH + rowH / 2;
          ghost.setAttribute("d", `M${x0} ${y0} L${x} ${y}`);
          const rr = vis[Math.floor(y / rowH)];
          const target = p.tasks[rr];
          if (target && rr !== r && Task.start(target) && Task.duration(target) != null) {
            dropRow = rr;
            // ligne visée en surbrillance, dans le planning et dans le tableau
            const ok = Links.canLink(p, t, target);
            el.canvas.querySelector(`.grow[data-r="${rr}"]`)?.classList.add(ok ? "drop-target" : "drop-bad");
            el.leftBody.querySelector(`.tcell[data-r="${rr}"]`)?.parentElement.classList.add(ok ? "drop-target" : "drop-bad");
            showTip(ev, ok ? `Lier à « ${target.label || "(sans nom)"} »` : "Lien impossible (boucle ou déjà lié)");
          } else showTip(ev, "Relâcher sur une autre tâche pour la lier");
        }
      };

      const onUp = () => {
        bar.removeEventListener("pointermove", onMove);
        bar.classList.remove("dragging");
        clearDrop();
        tip.remove();
        if (!moved) { select(r, sel ? sel.c : 0); return; }
        lastBarDown = { r: -1, time: 0 };   // un glissement n'est pas le 1er clic d'un double-clic
        if (mode === "move" && preview && preview.start !== tStart) {
          mutate(() => Tree.setStart(p, t, preview.start));
        } else if (mode === "resize" && preview && preview.days !== Task.duration(t)) {
          mutate(() => { Task.setDays(t, preview.days); delete t.dureeFormula; delete t.finText; });
        } else if (mode === "link" && dropRow != null) {
          const target = p.tasks[dropRow];
          if (Links.add(p, t, target)) { save(); toast(`« ${target.label || "(sans nom)"} » commence après « ${t.label || "(sans nom)"} »`); }
          else toast("Ces tâches sont déjà liées, ou le lien créerait une boucle");
          renderRows(); renderGantt();
        } else renderGantt();
        highlightGantt();
      };
      bar.addEventListener("pointermove", onMove);
      bar.addEventListener("pointerup", onUp, { once: true });
      bar.addEventListener("pointercancel", onUp, { once: true });
    });

    /* ========================================================
       DÉFILEMENT ET SÉPARATEUR
       ======================================================== */
    // le planning porte la barre verticale, le tableau suit
    el.rightBody.addEventListener("scroll", () => {
      el.leftBody.scrollTop = el.rightBody.scrollTop;
      el.rightHead.scrollLeft = el.rightBody.scrollLeft;
    });
    el.leftBody.addEventListener("scroll", () => { el.leftHead.scrollLeft = el.leftBody.scrollLeft; });
    // hauteur des lignes : boutons − / + et molette au-dessus du tableau
    const setRowH = (next) => {
      next = Math.max(MIN_ROW_H, Math.min(MAX_ROW_H, next));
      if (next === rowH) return;
      const top = el.rightBody.scrollTop / rowH;
      rowH = next;
      p.ui.rowHeight = rowH;
      Store.save();
      applyRowH();
      renderRows();
      renderGantt();
      el.rightBody.scrollTop = top * rowH;
    };
    root.querySelector('[data-act="row-up"]').addEventListener("click", () => setRowH(rowH + ROW_H_STEP));
    root.querySelector('[data-act="row-down"]').addEventListener("click", () => setRowH(rowH - ROW_H_STEP));
    el.leftBody.addEventListener("wheel", (e) => {
      // Ctrl + molette : hauteur des lignes
      if (e.ctrlKey) { e.preventDefault(); setRowH(rowH + (e.deltaY < 0 ? ROW_H_STEP : -ROW_H_STEP)); return; }
      if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; // défilement horizontal natif
      // molette seule : défile le planning, que le tableau suit (toujours alignés)
      e.preventDefault();
      el.rightBody.scrollTop += e.deltaMode === 1 ? e.deltaY * rowH : e.deltaY;
    }, { passive: false });

    const applyRatio = () => {
      const total = el.split.clientWidth - el.splitter.offsetWidth;
      const ratio = p.ui.gridRatio ?? DEFAULT_GRID_RATIO;
      const w = Math.max(MIN_PANE, Math.min(total - MIN_PANE, Math.round(total * ratio)));
      el.left.style.width = w + "px";
    };
    const setRatio = (r) => {
      p.ui.gridRatio = Math.max(0.1, Math.min(0.9, r));
      applyRatio();
      Store.save();
    };
    on(window, "resize", applyRatio);

    el.splitter.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      el.splitter.setPointerCapture(e.pointerId);
      el.splitter.classList.add("dragging");
      document.body.classList.add("resizing");
      const startX = e.clientX, startW = el.left.offsetWidth;
      const total = el.split.clientWidth - el.splitter.offsetWidth;
      const move = (ev) => {
        const w = Math.max(MIN_PANE, Math.min(total - MIN_PANE, startW + ev.clientX - startX));
        el.left.style.width = w + "px";
      };
      const up = () => {
        el.splitter.removeEventListener("pointermove", move);
        el.splitter.classList.remove("dragging");
        document.body.classList.remove("resizing");
        setRatio(el.left.offsetWidth / total);
      };
      el.splitter.addEventListener("pointermove", move);
      el.splitter.addEventListener("pointerup", up, { once: true });
    });
    el.splitter.addEventListener("dblclick", () => setRatio(DEFAULT_GRID_RATIO));
    el.splitter.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 0.1 : 0.02;
      if (e.key === "ArrowLeft") { e.preventDefault(); setRatio((p.ui.gridRatio ?? DEFAULT_GRID_RATIO) - step); }
      if (e.key === "ArrowRight") { e.preventDefault(); setRatio((p.ui.gridRatio ?? DEFAULT_GRID_RATIO) + step); }
    });

    /* ---------- Premier affichage ---------- */
    applyRatio();
    renderAll();
    scrollToToday();
    if (p.tasks.length) select(0, 0);
    el.leftBody.focus({ preventScroll: true });
  },
};

/* ============================================================
   Navigation (#/ = Menu, #/projet/<id> = Projet)
   ============================================================ */
const Router = {
  go(path) { location.hash = "#/" + path; },
  render() {
    const root = document.getElementById("app");
    const path = location.hash.replace(/^#\/?/, "");
    const m = path.match(/^projet\/(.+)$/);
    document.title = "Plan Projet";
    if (ProjectView.cleanup) { ProjectView.cleanup(); ProjectView.cleanup = null; }
    Store.currentId = null;
    if (m) {
      if (!Store.getProject(m[1])) {
        // page actualisée : on rouvre le projet de cet onglet
        Files.restore(m[1]).then((p) => {
          if (location.hash.replace(/^#\/?/, "") !== path) return;
          if (p) ProjectView.render(root, m[1]); else Router.go("");
        });
        return;
      }
      ProjectView.render(root, m[1]);
    } else {
      Files.forget();
      MenuView.render(root);
    }
  },
};

Store.load();
Theme.init();
WorkDir.load();
// fermeture de l'onglet ou du navigateur pendant qu'un projet est ouvert : le navigateur demande confirmation
window.addEventListener("beforeunload", (e) => {
  if (Store.currentId || Files.hasPending()) { e.preventDefault(); e.returnValue = ""; }
});
// application installée (Chrome / Edge) : ouverture d'un fichier de projet par double-clic
if ("launchQueue" in window) {
  window.launchQueue.setConsumer(async (params) => {
    if (params.files && params.files.length) {
      try { openProject(await Files.openHandle(params.files[0])); } catch (e) { toast("Impossible d'ouvrir ce fichier"); }
    }
  });
}
window.addEventListener("hashchange", () => Router.render());
Router.render();
</script>
</body>
</html>
