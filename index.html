const CALC_KEYS = ["heures", "duree", "debut", "fin"];
const fmtHours = (h) => (h == null ? "" : String(Math.round(h * 100) / 100).replace(".", ","));

// Ce qu'affiche une cellule : { text, invalid, calc }
function cellDisplay(t, key) {
  const a = Agg.get(t);
  if (a && CALC_KEYS.includes(key)) {
    const text = key === "heures" ? fmtHours(a.hours)
      : key === "duree" ? (a.dur == null ? "" : String(a.dur))
      : key === "debut" ? Dates.format(a.start)
      : Dates.format(Task.end(t));
    return { text, calc: true };
  }
  if (key === "label") return { text: t.label || "" };
  const m = key.match(/^niv(\d+)$/);
  if (m) return { text: t.level === Number(m[1]) ? t.label : "" };
  switch (key) {
    case "responsable": return { text: t.responsable || "" };
    case "avancement": {
      // affiché en pourcentage : nombre saisi (« 50 » ou « 50 % ») ou résultat d'un calcul (« =32/3 »)
      const raw = t.avancement || "";
      if (raw.startsWith("=")) {
        const v = evalFormula(raw);
        return v == null ? { text: raw, invalid: true, formulaError: true } : { text: fmtNum(v) + " %" };
      }
      const n = parseNum(raw.replace(/\s*%$/, ""));
      return { text: isNaN(n) ? raw : fmtNum(n) + " %" };
    }
    case "heures": {
      const raw = String(t.heures ?? "").trim();
      if (raw.startsWith("=")) {
        const v = evalFormula(raw);
        return v == null ? { text: raw, invalid: true, formulaError: true } : { text: fmtHours(v) };
      }
      return { text: t.heures, invalid: raw !== "" && isNaN(parseNum(raw)) };
    }
    case "duree": {
      if (t.dureeText) return { text: t.dureeText, invalid: true };
      const d = Task.duration(t);
      return { text: d == null ? "" : String(d) };
    }
    case "debut": return t.debutText ? { text: t.debutText, invalid: true } : { text: Dates.format(t.start) };
    case "fin": return t.finText ? { text: t.finText, invalid: true } : { text: Dates.format(Task.end(t)) };
  }
  return { text: "" };
}

// Enregistre la saisie d'une cellule dans la tâche
function commitCell(t, key, raw) {
  if (Task.isParent(t) && CALC_KEYS.includes(key)) return;   // calculé à partir des tâches filles
  raw = String(raw);
  const v = raw.trim();
  if (key === "label") { t.label = v; return; }
  const m = key.match(/^niv(\d+)$/);
  if (m) {
    const lvl = Number(m[1]);
    if (v) { t.level = lvl; t.label = v; } else if (t.level === lvl) t.label = "";
    return;
  }
  const ensureStart = () => { if (!t.start) { t.start = Dates.nextWorkday(todayISO()); delete t.debutText; } };
  switch (key) {
    case "responsable": case "avancement": t[key] = v; break;
    case "heures":
      t.heures = v; delete t.dureeText; delete t.finText; delete t.dureeFix; delete t.dureeFormula;
      if (v) ensureStart();
      break;
    case "duree": {
      delete t.finText; delete t.dureeFormula;
      if (!v) { t.heures = ""; delete t.dureeText; delete t.dureeFix; break; }
      // nombre, ou calcul commençant par « = » (ex. =2*5 → 10 jours ; le calcul reste modifiable)
      const n = v.startsWith("=") ? evalFormula(v) : parseNum(v);
      if (n == null || isNaN(n) || n < 0) { t.dureeText = v; delete t.dureeFix; break; }
      Task.setDays(t, Math.round(n));
      if (v.startsWith("=")) t.dureeFormula = v;
      ensureStart();
      break;
    }
    case "debut": {
      if (!v) { t.start = null; delete t.debutText; break; }
      const iso = Dates.parseFR(v);
      if (!iso) { t.debutText = v; break; }
      t.start = Dates.nextWorkday(iso); delete t.debutText;
      break;
    }
    case "fin": {
      delete t.finText;
      if (!v) break;
      let iso = Dates.parseFR(v);
      if (!iso) { t.finText = v; break; }
      ensureStart();
      iso = Dates.prevWorkday(iso);
      if (iso < t.start) iso = t.start;
      Task.setDays(t, Dates.workdaysBetween(t.start, iso));
      delete t.dureeFormula;
      break;
    }
  }
}

// Texte tabulé (Excel) → tableau de lignes / cellules ; gère les cellules entre guillemets
function parseTSV(text) {
  const rows = [];
  let row = [], cell = "", i = 0, quoted = false;
  text = text.replace(/\r\n?/g, "\n");
  while (i < text.length) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i += 2; continue; }
      if (ch === '"') { quoted = false; i++; continue; }
      cell += ch; i++; continue;
    }
    if (ch === '"' && cell === "") { quoted = true; i++; continue; }
    if (ch === "\t") { row.push(cell); cell = ""; i++; continue; }
    if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; i++; continue; }
    cell += ch; i++;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const toTSVCell = (s) => (/[\t\n"]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);

/* ============================================================
   Page Projet : tableau à gauche, planning à droite
   ============================================================ */
/* ============================================================
   Export / import Excel (.xlsx) et CSV
   Une ligne par tâche, dans l'ordre du tableau. Colonnes :
   N° · 1 · 2 · 3 · 4 · Responsable · Heures effectives · Durée jours · Date début · Date fin · Avancement · Dépend de
   Le nom de la tâche est dans la colonne de son niveau ; « Dépend de » liste les N° des tâches d'origine.
   Les valeurs des tâches mères sont exportées (calculées) mais recalculées à l'import.
   ============================================================ */
const DATA_SHEET = "PlanProjet_donnees";   // feuille masquée : données complètes de l'application
// n colonnes de niveau (1 à n), 4 au moins ; jusqu'à 10 si le projet a des tâches aussi fines
const levelCount = (p) => Math.max(4, ...p.tasks.map((t) => t.level || 1));
const exHeaders = (n) => ["N°", ...Array.from({ length: n }, (_, i) => String(i + 1)), "Responsable", "Heures effectives", "Durée jours", "Date début", "Date fin", "Avancement", "Dépend de", "Commentaires"];

/* ---------- Archive ZIP minimale (format des fichiers .xlsx) ---------- */
const Zip = {
  crcTable: null,
  crc32(bytes) {
    if (!this.crcTable) {
      this.crcTable = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        this.crcTable[n] = c >>> 0;
      }
    }
    let crc = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) crc = this.crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
    return (crc ^ 0xffffffff) >>> 0;
  },

  // fichiers stockés sans compression : { "chemin": "texte" } → Uint8Array
  create(files) {
    const enc = new TextEncoder(), parts = [], central = [];
    let offset = 0;
    for (const [name, text] of Object.entries(files)) {
      const nameBytes = enc.encode(name), data = enc.encode(text), crc = this.crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);
      local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, data.length, true);
      local.setUint16(26, nameBytes.length, true);
      parts.push(new Uint8Array(local.buffer), nameBytes, data);
      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true);
      cen.setUint32(16, crc, true); cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
      cen.setUint16(28, nameBytes.length, true); cen.setUint32(42, offset, true);
      central.push(new Uint8Array(cen.buffer), nameBytes);
      offset += 30 + nameBytes.length + data.length;
    }
    const cenSize = central.reduce((n, b) => n + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, Object.keys(files).length, true); end.setUint16(10, Object.keys(files).length, true);
    end.setUint32(12, cenSize, true); end.setUint32(16, offset, true);
    const all = [...parts, ...central, new Uint8Array(end.buffer)];
    const out = new Uint8Array(all.reduce((n, b) => n + b.length, 0));
    let pos = 0;
    for (const b of all) { out.set(b, pos); pos += b.length; }
    return out;
  },

  // lit une archive : renvoie { "chemin": async () => texte }
  read(buffer) {
    const bytes = new Uint8Array(buffer), view = new DataView(buffer);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("zip");
    const count = view.getUint16(eocd + 10, true);
    let p = view.getUint32(eocd + 16, true);
    const entries = {}, dec = new TextDecoder();
    for (let n = 0; n < count; n++) {
      if (view.getUint32(p, true) !== 0x02014b50) throw new Error("zip");
      const method = view.getUint16(p + 10, true), size = view.getUint32(p + 20, true);
      const nameLen = view.getUint16(p + 28, true), extraLen = view.getUint16(p + 30, true), commentLen = view.getUint16(p + 32, true);
      const localOff = view.getUint32(p + 42, true);
      const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      entries[name] = async () => {
        const start = localOff + 30 + view.getUint16(localOff + 26, true) + view.getUint16(localOff + 28, true);
        const raw = bytes.subarray(start, start + size);
        if (method === 0) return dec.decode(raw);
        if (method !== 8) throw new Error("zip");
        const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return dec.decode(await new Response(stream).arrayBuffer());
      };
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  },
};

const Exchange = {
  /* ---------- Projet → lignes (valeurs typées) ---------- */
  // chaque cellule : { v: texte|nombre, kind: "text"|"num"|"date"|"formula"|"pct", calc: bool }
  rows(p) {
    Tree.compute(p);
    const n = levelCount(p);
    const num = new Map(p.tasks.map((t, i) => [t.id, i + 1]));
    const deps = (t) => (p.links || []).filter((l) => l.to === t.id).map((l) => num.get(l.from)).filter(Boolean).sort((a, b) => a - b).join(", ");
    const numOrText = (s) => { const n = parseNum(s); return String(s).trim() === "" ? null : isNaN(n) ? { v: String(s), kind: "text" } : { v: n, kind: "num" }; };
    // heures : un calcul « = » est exporté par son résultat
    const hoursCell = (t) => { const h = Task.hours(t); return String(t.heures ?? "").trim().startsWith("=") && h != null && !isNaN(h) ? { v: Math.round(h * 1e6) / 1e6, kind: "num" } : numOrText(t.heures ?? ""); };
    useCoef(p);
    return p.tasks.map((t, i) => {
      const parent = Task.isParent(t), a = Agg.get(t);
      const row = [{ v: i + 1, kind: "num" }];
      for (let l = 1; l <= n; l++) row.push(t.level === l && t.label ? { v: t.label, kind: "text", bold: l === 1 } : null);
      row.push(t.responsable ? { v: t.responsable, kind: "text" } : null);
      if (parent) {
        row.push(a.hours == null ? null : { v: a.hours, kind: "num", calc: true });
        row.push(a.dur == null ? null : { v: a.dur, kind: "num", calc: true });
        row.push(a.start ? { v: a.start, kind: "date", calc: true } : null);
        row.push(a.end ? { v: a.end, kind: "date", calc: true } : null);
      } else {
        row.push(hoursCell(t));
        const d = Task.duration(t);
        row.push(t.dureeText ? { v: t.dureeText, kind: "text" } : d == null ? null : { v: d, kind: "num" });
        row.push(t.debutText ? { v: t.debutText, kind: "text" } : t.start ? { v: t.start, kind: "date" } : null);
        const end = Task.end(t);
        row.push(t.finText ? { v: t.finText, kind: "text" } : end ? { v: end, kind: "date" } : null);
      }
      const av = (t.avancement || "").trim();
      if (!av) row.push(null);
      else if (av.startsWith("=")) row.push({ v: av, kind: "formula" });
      else { const n = parseNum(av.replace(/\s*%$/, "")); row.push(isNaN(n) ? { v: av, kind: "text" } : { v: n, kind: "pct" }); }
      const dp = deps(t);
      row.push(dp ? { v: dp, kind: "text" } : null);
      row.push(t.comment ? { v: t.comment, kind: "text" } : null);
      return row;
    });
  },

  /* ---------- CSV (Excel français : séparateur ; et UTF-8 avec BOM) ---------- */
  toCSV(p) {
    const cell = (c) => {
      if (!c) return "";
      let s = c.kind === "date" ? Dates.format(c.v) : c.kind === "num" || c.kind === "pct" ? fmtNum(c.v) : String(c.v);
      if (c.kind === "pct") s += " %";
      return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const lines = [exHeaders(levelCount(p)).join(";"), ...this.rows(p).map((r) => r.map(cell).join(";"))];
    return "﻿" + lines.join("\r\n") + "\r\n";
  },

  /* ---------- XLSX ---------- */
  // embed : ajoute la feuille masquée avec les données de l'application (fichier de projet)
  toXLSX(p, embed = false) {
    const xmlEsc = (s) => esc(String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ""));
    const colName = (i) => { let s = ""; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
    const serial = (iso) => { const [y, m, d] = iso.split("-").map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };
    // styles : 0 normal · 1 gras · 2 date · 3 pourcentage · 4 gris (calculé) · 5 date calculée
    const cellXml = (c, ref) => {
      if (!c) return "";
      if (c.kind === "formula") return `<c r="${ref}" s="3"><f>${xmlEsc(c.v.slice(1))}</f></c>`;
      if (c.kind === "date") return `<c r="${ref}" s="${c.calc ? 5 : 2}"><v>${serial(c.v)}</v></c>`;
      if (c.kind === "num" || c.kind === "pct") return `<c r="${ref}" s="${c.kind === "pct" ? 3 : c.calc ? 4 : 0}"><v>${c.v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${c.bold ? ' s="1"' : ""}><is><t xml:space="preserve">${xmlEsc(c.v)}</t></is></c>`;
    };
    const n = levelCount(p);
    const head = `<row r="1">${exHeaders(n).map((h, i) => `<c r="${colName(i)}1" t="inlineStr" s="1"><is><t>${xmlEsc(h)}</t></is></c>`).join("")}</row>`;
    const body = this.rows(p).map((r, ri) => `<row r="${ri + 2}">${r.map((c, ci) => cellXml(c, colName(ci) + (ri + 2))).join("")}</row>`).join("");
    const widths = [6, ...Array(n - 1).fill(4), 40, 18, 10, 10, 12, 12, 12, 12, 50];
    const sheetName = xmlEsc((p.title || "Planning").replace(/[\[\]:*?/\\]/g, "-").slice(0, 31));
    const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
    const WS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet";
    let dataSheet = "", dataRel = "", dataType = "", dataXml = "";
    if (embed) {
      const json = Files.toText(p), chunks = [];
      for (let i = 0; i < json.length; i += 30000) chunks.push(json.slice(i, i + 30000));   // 32 767 caractères au plus par cellule
      dataSheet = `<sheet name="${DATA_SHEET}" sheetId="2" state="veryHidden" r:id="rId3"/>`;
      dataRel = `<Relationship Id="rId3" Type="${WS}" Target="worksheets/sheet2.xml"/>`;
      dataType = `<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;
      dataXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}><sheetData>${chunks.map((c, i) => `<row r="${i + 1}"><c r="A${i + 1}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c></row>`).join("")}</sheetData></worksheet>`;
    }
    const files = {
      "[Content_Types].xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${dataType}</Types>`,
      "_rels/.rels": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
      "xl/workbook.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${sheetName}" sheetId="1" r:id="rId1"/>${dataSheet}</sheets><calcPr fullCalcOnLoad="1"/></workbook>`,
      "xl/_rels/workbook.xml.rels": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${dataRel}</Relationships>`,
      "xl/styles.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet ${NS}><numFmts count="1"><numFmt numFmtId="164" formatCode="General&quot; %&quot;"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><sz val="11"/><color rgb="FF8A90A6"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="14" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
      "xl/worksheets/sheet1.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${head}${body}</sheetData></worksheet>`,
    };
    if (embed) files["xl/worksheets/sheet2.xml"] = dataXml;
    return Zip.create(files);
  },

  /* ---------- Lecture d'un fichier → tableau de lignes ---------- */
  async readFile(file) {
    if (/\.xlsx$/i.test(file.name)) return this.readXLSX(await file.arrayBuffer());
    const buf = await file.arrayBuffer();
    let text;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
    catch (e) { text = new TextDecoder("windows-1252").decode(buf); }   // CSV enregistré par un ancien Excel
    return this.parseCSV(text.replace(/^﻿/, ""));
  },

  parseCSV(text) {
    const first = text.split(/\r?\n/, 1)[0];
    const count = (ch) => first.split(ch).length - 1;
    const sep = [";", "\t", ","].sort((a, b) => count(b) - count(a))[0];
    const rows = [];
    let row = [], cell = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') quoted = false;
        else cell += ch;
      } else if (ch === '"' && cell === "") quoted = true;
      else if (ch === sep) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  },

  // feuilles du classeur, dans l'ordre : [{ name, hidden, rows }]
  async readWorkbook(buffer) {
    const zip = Zip.read(buffer);
    const xml = async (path) => (zip[path] ? new DOMParser().parseFromString(await zip[path](), "application/xml") : null);
    const wb = await xml("xl/workbook.xml"), rels = await xml("xl/_rels/workbook.xml.rels");
    const shared = [];
    const ss = await xml("xl/sharedStrings.xml");
    if (ss) for (const si of ss.getElementsByTagName("si")) shared.push([...si.getElementsByTagName("t")].map((t) => t.textContent).join(""));
    const colIndex = (ref) => { let n = 0; for (const ch of ref.replace(/\d+$/, "")) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
    const readSheet = (sheet) => {
      const rows = [];
      for (const r of sheet.getElementsByTagName("row")) {
        const ri = Number(r.getAttribute("r")) - 1;
        const row = [];
        for (const c of r.getElementsByTagName("c")) {
          const t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0], f = c.getElementsByTagName("f")[0];
          let val = "";
          if (t === "s") val = shared[Number(v && v.textContent)] ?? "";
          else if (t === "inlineStr") val = [...c.getElementsByTagName("t")].map((x) => x.textContent).join("");
          else if (t === "str" || t === "e") val = v ? v.textContent : "";
          else if (t === "b") val = v && v.textContent === "1" ? "VRAI" : "FAUX";
          else if (v) val = Number(v.textContent);
          row[colIndex(c.getAttribute("r"))] = f && f.textContent ? { value: val, formula: "=" + f.textContent } : val;
        }
        rows[ri] = row;
      }
      return Array.from(rows, (r) => r || []);
    };
    const sheets = [];
    const entries = wb ? [...wb.getElementsByTagName("sheet")] : [];
    for (const [i, sh] of entries.entries()) {
      const rid = sh.getAttribute("r:id") || sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      const rel = rels && [...rels.getElementsByTagName("Relationship")].find((r) => r.getAttribute("Id") === rid);
      let path = `xl/worksheets/sheet${i + 1}.xml`;
      if (rel) { const target = rel.getAttribute("Target"); path = target.startsWith("/") ? target.slice(1) : "xl/" + target; }
      const doc = await xml(path);
      if (doc) sheets.push({ name: sh.getAttribute("name"), hidden: !!sh.getAttribute("state") && sh.getAttribute("state") !== "visible", rows: readSheet(doc) });
    }
    if (!sheets.length) {
      const doc = await xml("xl/worksheets/sheet1.xml");
      if (!doc) throw new Error("xlsx");
      sheets.push({ name: "Feuille1", hidden: false, rows: readSheet(doc) });
    }
    return sheets;
  },

  // première feuille visible (import d'un classeur quelconque)
  async readXLSX(buffer) {
    const sheets = await this.readWorkbook(buffer);
    return (sheets.find((sh) => sh.name !== DATA_SHEET && !sh.hidden) || sheets[0]).rows;
  },

  // empreinte d'un planning (ce qui se voit dans la feuille), pour savoir s'il a été modifié dans Excel
  signature(tasks, links) {
    const q = { tasks, links: links || [] };
    Tree.compute(q);
    const idx = new Map(tasks.map((t, i) => [t.id, i]));
    const num = (s) => { const v = String(s ?? "").trim(); const n = parseNum(v.replace(/\s*%$/, "")); return isNaN(n) ? v : String(n); };
    const rows = tasks.map((t) => {
      const parent = Task.isParent(t);
      const h = Task.hours(t), hs = String(t.heures ?? "").trim().startsWith("=") && h != null && !isNaN(h) ? String(Math.round(h * 1e6) / 1e6) : t.heures;
      return [t.level, t.label, t.responsable || "", parent ? "" : num(hs), parent ? "" : t.start || "",
        (t.avancement || "").startsWith("=") ? t.avancement.trim() : num(t.avancement), (t.comment || "").trim()].join("\u0001");
    });
    const ls = q.links.map((l) => `${idx.get(l.from)}>${idx.get(l.to)}`).sort();
    return rows.join("\n") + "\n#" + ls.join(",");
  },

  // classeur de projet → { p, foreign, edited }
  //  - feuille masquée présente et planning inchangé : projet repris tel quel (rien n'est perdu)
  //  - planning modifié dans Excel : les tâches sont relues depuis la feuille visible
  //  - pas de feuille masquée : classeur « étranger », lu comme un import
  async projectFromXLSX(buffer, title) {
    const sheets = await this.readWorkbook(buffer);
    const data = sheets.find((sh) => sh.name === DATA_SHEET);
    const visible = sheets.find((sh) => sh !== data && !sh.hidden) || sheets.find((sh) => sh !== data);
    let stored = null;
    if (data) {
      try { stored = Files.fromText(data.rows.map((r) => (r[0] == null ? "" : String(r[0]))).join(""), title); } catch (e) { stored = null; }
    }
    useCoef(stored);   // durées relues avec le coefficient du projet
    let imported = null, importError = null;
    try { imported = visible ? this.toTasks(visible.rows) : null; } catch (e) { importError = e; }
    if (!stored) {
      if (!imported) throw importError || new Error("Ce classeur ne contient pas de planning.");
      const p = Store.blank(title);
      p.tasks = imported.tasks;
      this.applyLinks(p, imported.links, imported.warnings);
      return { p, foreign: true };
    }
    stored.title = title;
    if (!imported || this.signature(stored.tasks, stored.links) === this.signature(imported.tasks, imported.links)) return { p: stored };
    stored.tasks = imported.tasks;
    this.applyLinks(stored, imported.links, imported.warnings);
    return { p: stored, edited: true };
  },

  /* ---------- Tableau de lignes → tâches et liens ---------- */
  norm(s) { return String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, ""); },

  toTasks(rows) {
    const ALIASES = {
      num: ["n", "no", "numero", "num", "id"],
      ...Object.fromEntries(Array.from({ length: MAX_LEVEL }, (_, i) => ["l" + (i + 1), [String(i + 1), "niv" + (i + 1), "niveau" + (i + 1)]])),
      responsable: ["responsable"], realise: ["realise"], surveille: ["surveille"],
      heures: ["heureseffectives", "heures"], duree: ["dureejours", "duree"],
      debut: ["datedebut", "debut"], fin: ["datefin", "fin"],
      avancement: ["avancement"], deps: ["dependde", "depend", "predecesseurs", "predecesseur", "dependances"],
      comment: ["commentaires", "commentaire", "notes", "note", "remarques", "remarque"],
    };
    // ligne d'en-tête : la première où l'on reconnaît au moins une colonne de niveau
    let hr = -1, map = {};
    for (let i = 0; i < Math.min(rows.length, 20) && hr < 0; i++) {
      const m = {};
      (rows[i] || []).forEach((h, ci) => {
        const n = this.norm(typeof h === "object" ? h.value : h);
        for (const [key, names] of Object.entries(ALIASES)) if (names.includes(n) && m[key] == null) m[key] = ci;
      });
      if (m.l1 != null || m.l2 != null) { hr = i; map = m; }
    }
    if (hr < 0) throw new Error("Colonnes 1, 2, 3, 4 introuvables : la première ligne doit contenir les titres des colonnes.");

    const val = (row, key) => {
      if (map[key] == null) return "";
      const c = row[map[key]];
      return c == null ? "" : typeof c === "object" ? c : c;
    };
    const plain = (c) => (typeof c === "object" && c !== null ? c.value : c);
    const asText = (c) => { const v = plain(c); return typeof v === "number" ? String(Math.round(v * 1e6) / 1e6).replace(".", ",") : String(v ?? "").trim(); };
    const asDate = (c) => {
      const v = plain(c);
      if (typeof v === "number" && v > 0) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return Dates.format(`${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`); }
      return asText(c);
    };

    const tasks = [], byNum = new Map(), depsOf = [], warnings = [];
    for (let i = hr + 1; i < rows.length; i++) {
      const row = rows[i] || [];
      if (!row.some((c) => asText(c) !== "")) continue;   // ligne vide
      let level = 0, label = "";
      for (let l = 1; l <= MAX_LEVEL && !level; l++) { const s = asText(val(row, "l" + l)); if (s) { level = l; label = s; } }
      if (!level) { warnings.push(`Ligne ${i + 1} : aucun nom de tâche dans les colonnes de niveau (ligne ignorée)`); continue; }
      const t = Task.create(level);
      t.label = label;
      const resp = asText(val(row, "responsable")) || [asText(val(row, "realise")), asText(val(row, "surveille"))].filter(Boolean).join(" / ");
      if (resp) t.responsable = resp;
      const h = asText(val(row, "heures")), d = asText(val(row, "duree")), deb = asDate(val(row, "debut")), fin = asDate(val(row, "fin"));
      if (h) {
        commitCell(t, "heures", h);
        const dn = parseNum(d);
        if (d && !isNaN(dn) && Task.duration(t) !== Math.round(dn)) Task.setDays(t, Math.round(dn));
      } else if (d) commitCell(t, "duree", d);
      if (deb) {
        commitCell(t, "debut", deb);
        if (t.debutText) warnings.push(`Ligne ${i + 1} : date de début « ${deb} » non reconnue`);
      }
      if (fin && !h && !d) commitCell(t, "fin", fin);
      const av = val(row, "avancement");
      if (typeof av === "object" && av && av.formula) t.avancement = av.formula;
      else if (asText(av)) t.avancement = asText(av);
      const cm = String(plain(val(row, "comment")) ?? "").replace(/\r\n?/g, "\n").trim();
      if (cm) t.comment = cm;
      const n = parseInt(asText(val(row, "num")), 10);
      if (!isNaN(n)) byNum.set(n, t);
      byNum.set(`ligne${tasks.length + 1}`, t);
      depsOf.push([t, asText(val(row, "deps")), i + 1]);
      tasks.push(t);
    }
    // liens : « Dépend de » contient les N° des tâches d'origine
    const links = [];
    for (const [t, deps, line] of depsOf) {
      if (!deps) continue;
      for (const part of deps.split(/[,;\s]+/).filter(Boolean)) {
        const n = parseInt(part, 10);
        const from = byNum.get(n) || (map.num == null ? byNum.get(`ligne${n}`) : null);
        if (!from || from === t) warnings.push(`Ligne ${line} : « Dépend de » ${part} ne correspond à aucune tâche`);
        else links.push({ from: from.id, to: t.id });
      }
    }
    return { tasks, links, warnings };
  },

  // applique les liens importés (en écartant ceux qui créeraient une boucle)
  applyLinks(p, links, warnings) {
    p.links = [];
    for (const l of links) {
      const a = Links.byId(p, l.from), b = Links.byId(p, l.to);
      if (!Links.add(p, a, b)) warnings.push(`Lien « ${a.label} » → « ${b.label} » ignoré (boucle, doublon ou tâche mère)`);
    }
  },

  /* ---------- Enregistrement du fichier exporté ---------- */
  async save(p, kind) {
    const isX = kind === "xlsx";
    const data = isX ? this.toXLSX(p) : this.toCSV(p);
    const name = Files.safeName(p.title) + (isX ? ".xlsx" : ".csv");
    const type = isX ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : "text/csv";
    if (typeof window.showSaveFilePicker === "function") {
      let handle;
      try {
        handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: isX ? "Classeur Excel" : "Fichier CSV", accept: { [type]: [isX ? ".xlsx" : ".csv"] } }] });
      } catch (e) { return null; }
      const w = await handle.createWritable();
      await w.write(new Blob([data], { type }));
      await w.close();
      return handle.name;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return name;
  },

  // choisir un fichier .xlsx ou .csv à importer
  pick() {
    return new Promise((resolve) => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".xlsx,.csv,.txt";
      input.onchange = () => resolve(input.files[0] || null);
      input.click();
    });
  },

  // compte rendu d'import
  report(n, warnings) {
    const msg = `${n} tâche${n > 1 ? "s" : ""} importée${n > 1 ? "s" : ""}.`;
    if (!warnings.length) { toast(msg); return; }
    const list = warnings.slice(0, 12).join("\n") + (warnings.length > 12 ? `\n… et ${warnings.length - 12} autre(s)` : "");
    choiceDialog({ title: "Import terminé avec des remarques", message: `${msg}\n\n${list}`, choices: [{ label: "OK", value: true, primary: true }] });
  },
};

/* Fenêtre à plusieurs choix : renvoie la valeur du bouton cliqué (null si fermée) */
function choiceDialog({ title, message, choices }) {
  return new Promise((resolve) => {
    const bd = document.createElement("div");
    bd.className = "modal-backdrop";
    bd.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        <p style="white-space:pre-line">${esc(message)}</p>
        <div class="modal-actions">${choices.map((c, i) => `<button class="btn${c.primary ? " btn-primary" : ""}" data-i="${i}">${esc(c.label)}</button>`).join("")}</div>
      </div>`;
    const close = (val) => { bd.remove(); document.removeEventListener("keydown", onKey, true); resolve(val); };
    const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(null); } };
    bd.addEventListener("click", (e) => {
      if (e.target === bd) close(null);
      const b = e.target.closest("[data-i]");
      if (b) close(choices[+b.dataset.i].value);
    });
    document.addEventListener("keydown", onKey, true);
    document.body.appendChild(bd);
    (bd.querySelector(".btn-primary") || bd.querySelector("[data-i]")).focus();
  });
}

// historique d'annulation par projet ; celui du projet ouvert est gardé pour l'onglet (retrouvé après F5)
const History = new Map();   // id du projet → { undo: [], redo: [], last }
const HISTORY_KEY = "plan-projet:historique";
const HistoryStore = {
  load(id) {
    try {
      const o = JSON.parse(sessionStorage.getItem(HISTORY_KEY));
      return o && o.id === id ? { undo: o.undo || [], redo: o.redo || [] } : null;
    } catch (e) { return null; }
  },
  save(id, hist) {
    // stockage de l'onglet limité : en cas de manque de place, on oublie les étapes les plus anciennes
    let undo = hist.undo, redo = hist.redo;
    for (;;) {
      try { sessionStorage.setItem(HISTORY_KEY, JSON.stringify({ id, undo, redo })); return; }
      catch (e) {
        if (!undo.length && !redo.length) return;
        undo = undo.slice(Math.ceil(undo.length / 2));
        if (!undo.length) redo = redo.slice(Math.ceil(redo.length / 2));
      }
    }
  },
};

    root.querySelector('[data-slot="theme"]').replaceWith(Fullscreen.button(), Settings.button(), Theme.button());
    root.querySelector('[data-act="back"]').addEventListener("click", () => Router.go(""));
    // titre = nom du fichier, non modifiable ici (pour le changer : « Enregistrer sous »)

    const el = {
      split: root.querySelector(".split"),
      left: root.querySelector(".pane-left"),
