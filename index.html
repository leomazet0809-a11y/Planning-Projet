<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Projet</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b5bf0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Thème (tokens) — clair par défaut, sombre via [data-theme]
   ============================================================ */
:root {
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f0f2f8;
  --border: #e3e6ef;
  --grid-line: #f1f2f6;
  --weekend: rgba(20, 24, 40, .045);
  --text: #1b1e2b;
  --text-muted: #6b7189;
  --summary-default: #bcc1cd;   /* barres des tâches mères : gris léger */
  --accent: #5b5bf0;
  --accent-soft: #e9e9fe;
  --accent-text: #ffffff;
  --danger: #e5484d;
  --danger-soft: #fdecec;
  --task: #5b5bf0;   /* couleur unique des tâches, quel que soit leur niveau */
  --shadow: 0 1px 2px rgba(20, 24, 40, .05), 0 4px 16px rgba(20, 24, 40, .06);
  --radius: 14px;
  --radius-sm: 8px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #171a23;
  --surface-2: #1f2330;
  --border: #2a2f3e;
  --grid-line: #1c1f28;
  --weekend: rgba(255, 255, 255, .035);
  --text: #e8eaf2;
  --text-muted: #9097ad;
  --summary-default: #5c6277;
  --accent: #8484ff;
  --accent-soft: #262a52;
  --accent-text: #0f1117;
  --danger: #ff6b6f;
  --danger-soft: #3a1d22;
  --task: #8484ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* ---------- Barre du haut ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 10px;
  height: 42px; padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.brand-logo { width: 26px; height: 26px; display: block; flex: 0 0 auto; }
/* logo cliquable : retour au menu */
.logo-btn { border: 0; padding: 2px; margin: -2px; background: none; cursor: pointer; border-radius: 9px; flex: 0 0 auto; transition: transform .15s; }
.logo-btn:hover { transform: scale(1.08); }
.logo-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spacer { flex: 1; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); cursor: pointer;
  font-weight: 500; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn:disabled:hover { background: var(--surface); border-color: var(--border); }
.btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--danger); }
/* boutons Ajouter / Supprimer : icône seule, un peu plus larges que les boutons carrés */
.btn-icon-wide { width: 44px; padding: 0; justify-content: center; }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.icon-btn {
  width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
  display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .4; cursor: default; background: var(--surface); }
.icon-btn svg, .btn svg { width: 16px; height: 16px; flex: 0 0 auto; }

/* ---------- Page Menu ---------- */
.menu-page { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
.menu-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.menu-head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.menu-head p { margin: 4px 0 0; color: var(--text-muted); }
.workdir-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.workdir-line svg { width: 14px; height: 14px; flex: 0 0 auto; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
.grid-cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; display: flex; flex-direction: column; gap: 6px;
  transition: border-color .15s;
}
.card:hover { border-color: var(--accent); }
.card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.card-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.card-actions { display: flex; gap: 8px; margin-top: 12px; }
.card-actions .btn-primary { flex: 1; justify-content: center; }
.empty {
  text-align: center; padding: 64px 24px; color: var(--text-muted);
  border: 2px dashed var(--border); border-radius: var(--radius);
}
.empty h2 { color: var(--text); margin: 0 0 6px; font-size: 18px; }
.empty-small { color: var(--text-muted); padding: 12px 0; }
.section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 8px 0 12px; }
.card.recent { cursor: pointer; }
.card.recent:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.recent-title { font-size: 17px; font-weight: 600; }
.card-meta svg { width: 13px; height: 13px; vertical-align: -2px; }
.notice { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 20px; line-height: 1.5; }
.save-status.error { color: var(--danger); font-weight: 600; }
.file-chip {
  display: inline-flex; align-items: center; gap: 5px; max-width: 560px; flex: 0 1 auto;
  font-size: 12px; color: var(--text-muted); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; white-space: nowrap;
}
.file-chip span { overflow: hidden; text-overflow: ellipsis; }
.file-chip svg { width: 13px; height: 13px; flex: 0 0 auto; }
.save-status button { font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

/* ---------- Page Projet ---------- */
.project-title {
  flex: 0 1 auto; min-width: 0; margin: 0; padding: 3px 8px; font-size: 16px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.save-status { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.project-page { display: flex; flex-direction: column; height: 100vh; --row-h: 24px; --bar-h: 16px; --cell-font: 12px; --head-h: 72px; }
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 4px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
/* groupes de boutons accolés */
.btn-group { display: inline-flex; align-items: center; flex: 0 0 auto; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); overflow: hidden; }
.btn-group > .icon-btn { border: 0; border-radius: 0; height: 28px; }
.btn-group > * + * { border-left: 1px solid var(--border) !important; }
.btn-group > .zoom-label { align-self: stretch; display: grid; place-items: center; padding: 0 8px; }
/* infobulles : nom, explication et raccourci clavier */
.tip {
  position: fixed; z-index: 300; max-width: 280px; padding: 7px 10px; border-radius: 8px; pointer-events: none;
  background: var(--text); color: var(--surface); font-size: 12px; line-height: 1.4; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(-2px); transition: opacity .12s, transform .12s;
}
.tip.on { opacity: 1; transform: none; }
.tip b { font-weight: 600; }
.tip .tip-desc { opacity: .75; }
.tip .tip-kbd { margin-top: 4px; opacity: .9; }
.tip kbd {
  display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 4px; text-align: center;
  border: 1px solid color-mix(in srgb, var(--surface) 35%, transparent); font: inherit; font-size: 11px;
}
.hint { font-size: 12px; color: var(--text-muted); }
.zoom-label { font-size: 12px; color: var(--text-muted); min-width: 64px; text-align: center; }
.split { flex: 1; min-height: 0; display: flex; background: var(--surface); }
.pane { display: flex; flex-direction: column; min-width: 0; }
.pane-left { flex: 0 0 auto; }
.pane-right { flex: 1 1 auto; }
.pane-head {
  flex: 0 0 auto; height: var(--head-h); overflow: hidden;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.pane-body { flex: 1; min-height: 0; }
.pane-body:focus { outline: none; }
/* une seule barre verticale : celle du planning, collée au bord droit de la fenêtre */
.pane-left .pane-body { overflow-x: scroll; overflow-y: hidden; }
.pane-right .pane-body { overflow: scroll; }

/* ---------- Séparateur tableau / planning ---------- */
.splitter {
  flex: 0 0 7px; cursor: col-resize; position: relative;
  background: var(--border); transition: background .15s;
}
.splitter::after {
  content: ""; position: absolute; left: 2px; top: 50%; width: 3px; height: 32px;
  transform: translateY(-50%); border-radius: 2px;
  background: repeating-linear-gradient(var(--text-muted) 0 3px, transparent 3px 6px);
  opacity: .6;
}
.splitter:hover, .splitter.dragging, .splitter:focus-visible { background: var(--accent); outline: none; }
.splitter:hover::after, .splitter.dragging::after { background: repeating-linear-gradient(#fff 0 3px, transparent 3px 6px); opacity: 1; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }

/* ---------- Tableau ---------- */
.trow { display: flex; height: var(--row-h); border-bottom: 1px solid var(--grid-line); width: max-content; min-width: 100%; padding-left: var(--gutter); }
.project-page { --gutter: 28px; }
/* la première colonne laisse dépasser la poignée de déplacement dans la marge de gauche */
.pane-left .pane-body .tcell[data-c="0"] { overflow: visible; }
.tcell {
  position: relative; flex: 0 0 auto; border-right: 1px solid var(--grid-line);
  padding: 0 10px; line-height: calc(var(--row-h) - 1px);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  user-select: none; cursor: cell; font-size: var(--cell-font);
}
.tcell.num { text-align: right; }
.tcell.compact { padding-left: 6px; padding-right: 6px; }   /* colonnes de valeurs étroites : une date tient en entier */
.tcell.center { text-align: center; }
.tcell.lvl1 { font-weight: 600; }
/* libellé d'un niveau qui déborde sur les colonnes Niv suivantes (vides) */
.tcell.spill-from { overflow: visible; z-index: 1; }
.tcell.spill-from, .tcell.spill-over { border-right-color: transparent; }
.spill-text {
  position: absolute; left: 10px; top: 0; pointer-events: none;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.tcell.invalid { color: var(--danger); font-weight: 600; }
/* valeurs calculées des tâches mères : texte normal, un peu plus gris que le reste */
.tcell.calc { color: color-mix(in srgb, var(--text-muted) 85%, var(--bg)); }
.tcell.in-range { background: var(--accent-soft); }
.tcell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.trow.row-sel { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.thead-row { height: 72px; border-bottom: 0; }
/* ligne de filtres sous les en-têtes du tableau */
.filter-row { height: 28px; border-bottom: 0; border-top: 1px solid var(--border); background: var(--surface-2); }
.filter-row .fcell { flex: 0 0 auto; padding: 3px 3px; position: relative; }
.filter-input {
  width: 100%; height: 22px; border: 1px solid var(--border); border-radius: 6px; padding: 0 20px 0 6px;
  font: inherit; font-size: 12px; color: var(--text); background: var(--surface);
}
.filter-input:focus { outline: none; border-color: var(--accent); }
.filter-input.active { border-color: var(--accent); background: var(--accent-soft); }
.filter-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--text-muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
.filter-btn { position: relative; }
.filter-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.filter-btn .badge { position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; text-align: center; padding: 0 3px; }
/* tâche mère affichée seulement pour situer une tâche trouvée */
.trow.filter-context .tcell { opacity: .45; }
.thead-row .tcell { border-right-color: var(--border); }
.thead-row .tcell[data-fixed] { padding: 0 0 8px; justify-content: center; text-align: center; font-size: 11px; }
.thead-row .tcell {
  display: flex; align-items: flex-end; padding-bottom: 8px; line-height: 1.25;
  white-space: normal; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: default;
}
.col-resize { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 2; }
.col-resize:hover { background: linear-gradient(to right, transparent 3px, var(--accent) 3px 5px, transparent 5px); }
.cell-editor {
  position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box;
  border: 2px solid var(--accent); padding: 0 8px; margin: 0;
  font: inherit; color: var(--text); background: var(--surface); outline: none;
}
.cell-editor.num { text-align: right; }
.cell-editor.center { text-align: center; }
.table-empty { padding: 32px 24px; color: var(--text-muted); }
/* poignée pour déplacer une tâche (et ses sous-tâches) dans le tableau */
.pane-left .pane-body { position: relative; }
/* colonne Tâche : le nom est placé selon son niveau (retrait), dans un bloc qui s'arrête au bord de la colonne */
.pane-left .pane-body .tcell[data-c="0"] { padding: 0; }
.tree-svg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; overflow: visible; }
.tree-svg { opacity: .45; }
.tree-svg .tree-line { fill: none; stroke: var(--text-muted); stroke-width: 1.2; }
.tree-svg marker path { fill: var(--text-muted); }
/* bouton réduire / déployer d'une tâche mère */
.twisty {
  position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; z-index: 3;
  display: grid; place-items: center; cursor: pointer; border-radius: 3px; color: var(--text-muted);
}
.twisty:hover { background: var(--surface-2); color: var(--text); }
.twisty svg { width: 10px; height: 10px; transition: transform .15s; }
.twisty.closed svg { transform: rotate(-90deg); }
.grip {
  position: absolute; left: calc(2px - var(--gutter)); top: 50%; width: 12px;
  height: min(16px, calc(var(--row-h) - 2px)); transform: translateY(-50%);
  border-radius: 4px; cursor: grab; opacity: 0; z-index: 2;
  background: radial-gradient(circle, var(--text-muted) 1.2px, transparent 1.6px) 0 0 / 7px 6px;
  background-origin: content-box; padding: 2px 1px;
}
.trow:hover .grip { opacity: .7; }
.grip:hover { opacity: 1 !important; background-color: var(--surface-2); }
.drop-line { position: absolute; left: 0; right: 0; height: 3px; margin-top: -1.5px; background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 5; }
.trow.moving { opacity: .45; }
body.row-dragging, body.row-dragging * { cursor: grabbing !important; user-select: none !important; }

/* ---------- Planning Gantt ---------- */
.pane-right .pane-head { display: flex; flex-direction: column; justify-content: flex-end; }
.gantt-head { position: relative; height: 72px; flex: 0 0 auto; }
.gh-row { position: relative; height: 18px; border-bottom: 1px solid var(--border); }
.gh-row:last-child { border-bottom: 0; }
.gh-cell {
  position: absolute; top: 0; height: 100%;
  border-left: 1px solid var(--border);
  font-size: 11px; line-height: 17px; padding: 0 6px;
  white-space: nowrap; overflow: clip; color: var(--text-muted);
}
.gh-row.days .gh-cell { padding: 0; text-align: center; }
.gh-cell .stick { position: sticky; left: 0; padding: 0 6px; }
.gh-row:not(.days) .gh-cell { padding: 0; }
.gh-cell.we { background: var(--weekend); }
.gh-cell.today { background: var(--accent); color: #fff; font-weight: 600; }
.gh-row.years .gh-cell { font-weight: 600; color: var(--text); }
.gh-row.months .gh-cell { color: var(--text); text-transform: capitalize; }
.gantt-canvas { position: relative; min-height: 100%; cursor: grab; }
.gantt-canvas.panning, .gantt-canvas.panning * { cursor: grabbing !important; }
.grow { position: relative; height: var(--row-h); border-bottom: 1px solid var(--grid-line); }
.grow.row-sel { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.grow.drop-target, .trow.drop-target { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.grow.drop-bad, .trow.drop-bad { background: color-mix(in srgb, var(--danger) 14%, transparent); }
.today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .55; pointer-events: none; z-index: 1; }
.bar {
  position: absolute; top: calc((var(--row-h) - var(--bar-h)) / 2 - .5px); height: var(--bar-h); border-radius: 6px; z-index: 2;
  background: var(--c); cursor: grab; touch-action: none;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .15);
}
.bar { --c: var(--task); }
.bar.dragging { cursor: grabbing; opacity: .85; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.bar.sel { outline: 1.5px solid var(--accent); outline-offset: 2px; }
/* avancement : partie réalisée de la couleur de la tâche, reste plus clair */
.bar.has-prog { background: color-mix(in srgb, var(--c) 38%, var(--surface)); }
.bar .prog { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); border-radius: 6px 0 0 6px; pointer-events: none; }
.bar .prog.full { border-radius: 6px; }
.bar .h-end { position: absolute; right: 0; top: 0; bottom: 0; width: 9px; cursor: ew-resize; border-radius: 0 6px 6px 0; }
.bar .h-end::after { content: ""; position: absolute; right: 3px; top: 25%; bottom: 25%; width: 2px; border-radius: 1px; background: rgba(255, 255, 255, .7); }
.bar .link-dot {
  position: absolute; right: -16px; top: 50%; width: 11px; height: 11px; margin-top: -5.5px;
  border-radius: 50%; border: 2px solid var(--c); background: var(--surface);
  cursor: crosshair; opacity: 0; transition: opacity .15s;
}
.bar:hover .link-dot, .bar.dragging .link-dot { opacity: 1; }
/* tâche mère : barre récapitulative avec pointes aux extrémités */
.bar.summary { height: 8px; top: calc((var(--row-h) - 8px) / 2 - 3px); border-radius: 2px 2px 0 0; background: var(--summary, var(--summary-default)); }
.bar.summary::before, .bar.summary::after { content: ""; position: absolute; top: 100%; width: 0; height: 0; border-top: 6px solid var(--summary, var(--summary-default)); }
.bar.summary::before { left: 0; border-right: 6px solid transparent; }
.bar.summary::after { right: 0; border-left: 6px solid transparent; }
.bar.summary .h-end { display: none; }
/* jalon (durée 0) : losange */
.bar.ms { width: 14px !important; background: none; box-shadow: none; }
.bar.ms::before { content: ""; position: absolute; left: 2px; top: calc(var(--bar-h) / 2 - 5px); width: 10px; height: 10px; background: var(--c); transform: rotate(45deg); border-radius: 2px; }
.bar.ms .h-end { display: none; }
.links-svg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; overflow: visible; }
.links-svg .link { fill: none; stroke: var(--text-muted); stroke-width: 1.5; }
.links-svg .link.slack { stroke-dasharray: 4 3; }   /* la tâche liée ne commence pas au plus tôt */
.links-svg .link-hit { fill: none; stroke: transparent; stroke-width: 10; pointer-events: stroke; cursor: pointer; }
.links-svg .link-hit:hover + .link { stroke: var(--danger); stroke-width: 2.5; }
.links-svg .ghost { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
.links-svg marker path { fill: var(--text-muted); }
.drag-tip {
  position: fixed; z-index: 50; pointer-events: none;
  background: var(--text); color: var(--bg); font-size: 12px; font-weight: 500;
  padding: 4px 8px; border-radius: 6px; white-space: nowrap;
}

/* ---------- Paramètres ---------- */
.settings-panel {
  position: fixed; top: 48px; right: 12px; z-index: 150; width: 290px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);

}

<script>
"use strict";

/* ============================================================
   Utilitaires
   ============================================================ */
const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => Dates.toISO(new Date());
const formatDateFR = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ICONS = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h9V3M7 21v-7h10v7"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  expandAll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v15M4.5 15.5L8 19l3.5-3.5M16 4v15M12.5 15.5L16 19l3.5-3.5"/></svg>',
  collapseAll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V5M4.5 8.5L8 5l3.5 3.5M16 20V5M12.5 8.5L16 5l3.5 3.5"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  saveAs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l5 5v5"/><path d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/><path d="M7 3v6h9V3M17 16v6M14 19h6"/></svg>',
  fullscreen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  exitFullscreen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  exportFile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 18v-6M9 15l3 3 3-3"/></svg>',
  importFile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15l3-3 3 3"/></svg>',
  filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.5" fill="currentColor"/></svg>',
};

const LOGO_SVG = `<svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5bf0"/><stop offset="1" stop-color="#b07cff"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#logo-g)"/><rect x="13" y="16" width="22" height="7.5" rx="3.75" fill="#fff"/><rect x="24" y="28.25" width="21" height="7.5" rx="3.75" fill="#fff"/><rect x="34" y="40.5" width="17" height="7.5" rx="3.75" fill="#fff" fill-opacity=".6"/></svg>`;

function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ============================================================
   Dates — jours ouvrés (lundi → vendredi)
   ============================================================ */
const Dates = {
  parseISO(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 12); },
  toISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; },
  isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; },
  addDays(iso, n) { const d = this.parseISO(iso); d.setDate(d.getDate() + n); return this.toISO(d); },
  diffDays(a, b) { return Math.round((this.parseISO(b) - this.parseISO(a)) / 864e5); },
  // samedi / dimanche → lundi suivant
  nextWorkday(iso) { const d = this.parseISO(iso); while (this.isWeekend(d)) d.setDate(d.getDate() + 1); return this.toISO(d); },
  // samedi / dimanche → vendredi précédent
  prevWorkday(iso) { const d = this.parseISO(iso); while (this.isWeekend(d)) d.setDate(d.getDate() - 1); return this.toISO(d); },
  // avance (ou recule si n < 0) de n jours ouvrés
  addWorkdays(iso, n) {
    const d = this.parseISO(iso), step = n < 0 ? -1 : 1;
    while (n !== 0) { d.setDate(d.getDate() + step); if (!this.isWeekend(d)) n -= step; }
    return this.toISO(d);
  },
  // nombre de jours ouvrés de a à b inclus
  workdaysBetween(a, b) {
    const d = this.parseISO(a), end = this.parseISO(b);
    let n = 0;
    while (d <= end) { if (!this.isWeekend(d)) n++; d.setDate(d.getDate() + 1); }
    return n;
  },
  // écart signé en jours ouvrés entre deux jours ouvrés
  workdayDiff(a, b) {
    if (a === b) return 0;
    return b > a ? this.workdaysBetween(a, b) - 1 : -(this.workdaysBetween(b, a) - 1);
  },
  mondayOf(iso) { const d = this.parseISO(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return this.toISO(d); },
  isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  },
  format(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; },
  // accepte 21/10/2026, 21/10/26, 21-10-2026, 21.10 (année en cours), 2026-10-21
  parseFR(s) {
    s = s.trim();
    let day, month, year;
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) { year = +m[1]; month = +m[2]; day = +m[3]; }
    else {
      m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4}))?$/);
      if (!m) return null;
      day = +m[1]; month = +m[2];
      year = m[3] ? +m[3] : new Date().getFullYear();
      if (year < 100) year += 2000;
    }
    const d = new Date(year, month - 1, day, 12);
    if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
    return this.toISO(d);
  },
};

/* ============================================================
   Calculs d'une tâche
   ============================================================ */
// coefficient du projet ouvert : Durée jours = Heures effectives × coefficient (réglable par projet dans Paramètres)
const DEFAULT_COEF = 1.5;
let HOURS_TO_DAYS = DEFAULT_COEF;
const useCoef = (p) => { const c = Number(p && p.ui && p.ui.coef); HOURS_TO_DAYS = c > 0 ? c : DEFAULT_COEF; };

// nombre positif, virgule ou point acceptés ; NaN sinon
// Formule de la colonne Avancement : « =32/3 » → 10,67. Opérations + - * / et parenthèses,
// décimales avec virgule ou point. Renvoie null si la formule est incorrecte.
function evalFormula(src) {
  const toks = String(src).replace(/^=/, "").replace(/,/g, ".").match(/\d+(?:\.\d+)?|[-+*/()]|\S/g) || [];
  let i = 0;
  const peek = () => toks[i];
  const expr = () => {
    let v = term();
    while (peek() === "+" || peek() === "-") v = toks[i++] === "+" ? v + term() : v - term();
    return v;
  };
  const term = () => {
    let v = factor();
    while (peek() === "*" || peek() === "/") v = toks[i++] === "*" ? v * factor() : v / factor();
    return v;
  };
  const factor = () => {
    const tk = toks[i++];
    if (tk === "-") return -factor();
    if (tk === "+") return factor();
    if (tk === "(") { const v = expr(); if (toks[i++] !== ")") throw 0; return v; }
    if (/^\d/.test(tk || "")) return Number(tk);
    throw 0;
  };
  try {
    if (!toks.length) return null;
    const v = expr();
    return i === toks.length && isFinite(v) ? v : null;
  } catch (e) { return null; }
}
const fmtNum = (v) => String(Math.round(v * 100) / 100).replace(".", ",");

function parseNum(s) {
  const v = String(s).trim().replace(",", ".");
  return /^\d+(\.\d+)?$/.test(v) ? Number(v) : NaN;
}

const Task = {
  create(level = 1) {
    return { id: uid("t"), level, label: "", responsable: "", heures: "", start: Dates.nextWorkday(todayISO()) };
  },
  // avancement en % (0 à 100) : nombre saisi ou résultat d'un calcul « = » ; null si vide ou incorrect
  progress(t) {
    const raw = String(t.avancement || "").trim();
    if (!raw) return null;
    const n = raw.startsWith("=") ? evalFormula(raw) : parseNum(raw.replace(/\s*%$/, ""));
    return n == null || isNaN(n) ? null : Math.max(0, Math.min(100, n));
  },
  // heures effectives : nombre saisi ou résultat d'un calcul « = » ; null si vide, NaN si incorrect
  hours(t) {
    const raw = String(t.heures ?? "").trim();
    if (!raw) return null;
    const v = raw.startsWith("=") ? evalFormula(raw) : parseNum(raw);
    return v == null ? NaN : v;
  },
  // Durée jours = Heures effectives × coefficient, arrondie à l'entier le plus proche ; null si incalculable
  // (une durée saisie directement est gardée telle quelle : dureeFix)
  duration(t) {
    const a = Agg.get(t);
    if (a) return a.dur;
    if (t.dureeText) return null;
    if (t.dureeFix != null) return t.dureeFix;
    const h = this.hours(t);
    return h == null || isNaN(h) ? null : Math.max(0, Math.round(h * HOURS_TO_DAYS));
  },
  // durée imposée en jours (saisie, date de fin, barre étirée) : les heures en découlent
  setDays(t, days) {
    t.dureeFix = days;
    t.heures = this.hoursFromDays(days);
    delete t.dureeText;
  },
  // heures arrondies à l'heure entière
  hoursFromDays(days) { return String(Math.round(days / HOURS_TO_DAYS)); },
  start(t) {
    const a = Agg.get(t);
    return a ? a.start : t.start;
  },
  end(t) {
    const a = Agg.get(t);
    if (a) return a.end;   // tâche mère : fin de la dernière tâche fille
    const d = this.duration(t), start = this.start(t);
    if (d == null || !start) return null;
    return Dates.addWorkdays(start, Math.max(d, 1) - 1);
  },
  isParent(t) { return Agg.has(t); },
};

/* ============================================================
   Tâches mères : une tâche suivie de tâches de niveau inférieur
   (ses tâches filles) a ses heures, sa durée et son début calculés.
   Heures = somme des heures des filles · Durée = somme des durées des filles
   Début = début le plus tôt des filles · Fin = fin la plus tardive des filles
   (la barre couvre la période réelle des filles) · valable à tous les niveaux
   ============================================================ */
const Agg = new WeakMap();   // tâche mère → { r, last, hours, dur, start, end }

const Tree = {
  // fin (exclue) du bloc de la tâche r : elle + ses descendantes
  blockEnd(p, r) {
    let end = r + 1;
    while (end < p.tasks.length && p.tasks[end].level > p.tasks[r].level) end++;
    return end;
  },

  compute(p) {
    const tasks = p.tasks;
    tasks.forEach((t) => Agg.delete(t));
    // parcours de bas en haut : les filles sont calculées avant leur mère
    for (let r = tasks.length - 1; r >= 0; r--) {
      const last = this.blockEnd(p, r);
      if (last === r + 1) continue;
      let hours = null, dur = null, start = null, end = null;
      // filles directes : descendantes dont la mère la plus proche est r
      for (let k = r + 1; k < last; k = this.blockEnd(p, k)) {
        const c = tasks[k];
        const a = Agg.get(c);
        const h = a ? a.hours : Task.hours(c);
        if (h != null && !isNaN(h)) hours = (hours || 0) + h;
        const d = Task.duration(c);
        if (d != null) dur = (dur || 0) + d;
        const st = Task.start(c);
        if (st && d != null && (!start || st < start)) start = st;
        const en = Task.end(c);
        if (en && (!end || en > end)) end = en;
      }
      Agg.set(tasks[r], { r, last, hours, dur: start ? dur : null, start, end: start ? end : null });
    }
  },

  // place le début d'une tâche ; une tâche mère déplace toutes ses descendantes
  setStart(p, t, iso) {
    const a = Agg.get(t);
    if (!a) { t.start = iso; delete t.debutText; return; }
    if (!a.start) return;
    this.shift(p, t, Dates.workdayDiff(a.start, iso));
  },

  shift(p, t, delta) {
    if (!delta) return;
    const a = Agg.get(t);
    if (!a) { if (t.start) t.start = Dates.addWorkdays(t.start, delta); return; }
    for (let k = a.r + 1; k < a.last; k++) {
      const c = p.tasks[k];
      if (!Agg.has(c) && c.start) c.start = Dates.addWorkdays(c.start, delta);
    }
  },
};

/* ============================================================
   Dépendances : B commence après la fin de A
   ============================================================ */
const Links = {
  byId(p, id) { return p.tasks.find((t) => t.id === id); },

  // A peut-elle être liée à B sans créer de boucle ?
  canLink(p, a, b) {
    if (a === b) return false;
    // pas de lien entre une tâche mère et l'une de ses descendantes
    const ra = p.tasks.indexOf(a), rb = p.tasks.indexOf(b);
    if ((rb > ra && rb < Tree.blockEnd(p, ra)) || (ra > rb && ra < Tree.blockEnd(p, rb))) return false;
    if ((p.links || []).some((l) => l.from === a.id && l.to === b.id)) return false;
    const seen = new Set(), stack = [b.id];
    while (stack.length) {
      const id = stack.pop();
      if (id === a.id) return false;
      if (seen.has(id)) continue;
      seen.add(id);
      p.links.forEach((l) => { if (l.from === id) stack.push(l.to); });
    }
    return true;
  },

  add(p, a, b) {
    p.links = p.links || [];
    if (!this.canLink(p, a, b)) return false;
    p.links.push({ from: a.id, to: b.id });
    this.enforce(p);
    return true;
  },

  // Décale les tâches liées du même nombre de jours ouvrés (elles « suivent »)
  shiftSuccessors(p, t, delta, seen = new Set()) {
    (p.links || []).forEach((l) => {
      if (l.from !== t.id) return;
      const s = this.byId(p, l.to);
      if (!s || seen.has(s.id) || !Task.start(s)) return;
      seen.add(s.id);
      Tree.shift(p, s, delta);
      this.shiftSuccessors(p, s, delta, seen);
    });
  },

  // Aucune tâche liée ne peut commencer avant la fin de sa tâche d'origine
  enforce(p) {
    for (let i = 0; i <= p.tasks.length; i++) {
      let changed = false;
      Tree.compute(p);
      (p.links || []).forEach((l) => {
        const a = this.byId(p, l.from), b = this.byId(p, l.to);
        const endA = a && Task.end(a), startB = b && Task.start(b);
        if (!endA || !startB) return;
        const min = Dates.addWorkdays(endA, 1);
        if (startB < min) { Tree.setStart(p, b, min); Tree.compute(p); changed = true; }
      });
      if (!changed) break;
    }
  },

  // jours ouvrés entre le début au plus tôt de la tâche liée et son début réel (0 = commence au plus tôt)
  slack(p, l) {
    const a = this.byId(p, l.from), b = this.byId(p, l.to);
    const endA = a && Task.end(a), startB = b && Task.start(b);
    if (!endA || !startB) return 0;
    const min = Dates.addWorkdays(endA, 1);
    return startB > min ? Dates.workdayDiff(min, startB) : 0;
  },

  // À appeler après une modification : les tâches liées suivent toute tâche dont la fin a bougé
  afterChange(p, endsBefore) {
    Tree.compute(p);
    const seen = new Set();
    const moves = p.tasks
      .map((t) => [t, endsBefore.get(t), Task.end(t)])
      .filter(([, a, b]) => a && b && a !== b);
    moves.forEach(([t, a, b]) => this.shiftSuccessors(p, t, Dates.workdayDiff(a, b), seen));
    this.enforce(p);
  },
};

/* ============================================================
   Store — projets ouverts (en mémoire) + préférences (navigateur)
   Les projets eux-mêmes sont des classeurs .xlsx sur l'ordinateur (voir Files).
   ============================================================ */
const STORAGE_KEY = "plan-projet:v1";

const Store = {
  data: null,
  currentId: null,   // projet affiché

  load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { raw = null; }
    // les anciens projets conservés dans le navigateur ne sont pas repris : seuls le thème et les réglages restent
    this.data = { version: 2, theme: raw?.theme ?? null, settings: raw?.settings || {}, projects: [] };
    if (raw && raw.projects) this.savePrefs();
  },

  // complète un projet et regroupe l'ancien couple « nom / titre » en un seul titre
  normalize(p) {
    p.ui = p.ui || {}; p.tasks = p.tasks || []; p.links = p.links || [];
    if ("name" in p) {
      if (!p.title || p.title === "Titre du projet") p.title = p.name || "Projet";
      delete p.name;
    }
    p.title = p.title || "Projet";
    // ancienne colonne « 4 » (220 px) → colonne Tâche (avec les 3 colonnes de 24 px)
    const cw = p.ui.colWidths;
    if (cw && cw.niv4 != null) { if (cw.label == null) cw.label = cw.niv4 + 72; delete cw.niv4; }
    p.tasks.forEach((t) => {
      if ("realise" in t || "surveille" in t) {
        if (!t.responsable) t.responsable = [t.realise, t.surveille].map((x) => (x || "").trim()).filter(Boolean).join(" / ");
        delete t.realise; delete t.surveille;
      }
    });
  },

  savePrefs() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, theme: this.data.theme, settings: this.data.settings })); }
    catch (e) { console.warn("Préférences non enregistrées", e); }
  },

  // enregistre les préférences et, en temps réel, le projet ouvert dans son fichier
  save() {
    this.savePrefs();
    const p = this.currentId && this.getProject(this.currentId);
    if (p) { Files.queue(p); Files.remember(p); }
    return true;
  },

  getProject(id) { return this.data.projects.find((p) => p.id === id); },

  blank(title) {
    return { id: uid("p"), title, createdAt: todayISO(), updatedAt: todayISO(), ui: {}, tasks: [], links: [] };
  },

  updateProject(id, patch) {
    const p = this.getProject(id);
    if (!p) return;
    Object.assign(p, patch, { updatedAt: todayISO() });
    this.save();
  },
};

/* ============================================================
   Fichiers de projet (.xlsx) : ouvrir, créer, enregistrer en temps réel
   (Chrome / Edge : écriture directe dans le fichier ; autres navigateurs : téléchargement)
   ============================================================ */
// Le projet est un vrai classeur Excel : feuille « Planning » visible + feuille masquée avec les données de l'application.
// L'ancien format .proj (texte JSON) n'est plus enregistré : à l'ouverture, il est converti en classeur .xlsx.
const PROJ_EXT = ".xlsx";
const LEGACY_EXT = ".proj";
const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const FILE_TYPES = [{ description: "Projet Plan Projet (classeur Excel)", accept: { [XLSX_MIME]: [PROJ_EXT] } }];
const OPEN_TYPES = [{ description: "Projet Plan Projet", accept: { [XLSX_MIME]: [PROJ_EXT], "application/x-plan-projet": [LEGACY_EXT] } }];

const Files = {
  supported: typeof window.showOpenFilePicker === "function" && typeof window.showSaveFilePicker === "function",
  handles: new Map(),   // id du projet → fichier
  timers: new Map(),    // id → enregistrement différé
  chains: new Map(),    // id → écritures en cours (les unes après les autres)
  states: new Map(),    // id → "saved" | "saving" | "unsaved" | "permission" | "error"
  recentKeys: new Map(),// id → clé du fichier dans les récents (pour le rouvrir après actualisation)
  dirty: new Set(),     // projets modifiés mais pas encore écrits dans leur fichier
  onStatus: null,

  fileName(id) { return this.handles.get(id)?.name || ""; },
  baseName(name) { return name.replace(/\.[^.]+$/, ""); },
  safeName(title) { return (title || "Projet").replace(/[\\/:*?"<>|]+/g, "-").trim() || "Projet"; },

  setState(id, state) { this.states.set(id, state); if (this.onStatus) this.onStatus(id, state); },

  toText(p) {
    const { title, createdAt, updatedAt, ui, tasks, links } = p;
    return JSON.stringify({ app: "Plan Projet", version: 1, title, createdAt, updatedAt, ui, tasks, links }, null, 2);
  },
  isLegacy(name) { return /\.proj$/i.test(name || ""); },
  // contenu écrit dans le fichier : classeur Excel
  toBytes(p) { return Exchange.toXLSX(p, true); },
  // lit un fichier de projet → { p, foreign, edited }
  async fromFile(file, name) {
    if (this.isLegacy(name)) return { p: this.fromText(await file.text(), this.baseName(name)) };
    return Exchange.projectFromXLSX(await file.arrayBuffer(), this.baseName(name));
  },
  fromText(text, fallbackTitle) {
    const raw = JSON.parse(text);
    if (!raw || !Array.isArray(raw.tasks)) throw new Error("format");
    const p = { id: uid("p"), title: raw.title || fallbackTitle, createdAt: raw.createdAt || todayISO(), updatedAt: raw.updatedAt || todayISO(), ui: raw.ui, tasks: raw.tasks, links: raw.links };
    Store.normalize(p);
    return p;
  },

  register(p, handle) {
    Store.data.projects.push(p);
    if (handle) this.handles.set(p.id, handle);
    this.setState(p.id, handle ? "saved" : "unsaved");
    return p;
  },

  // Nouveau projet : on choisit tout de suite le dossier et le nom du fichier
  async create() {
    if (!this.supported) return this.register(Store.blank("Nouveau projet"), null);
    let handle;
    try { handle = await window.showSaveFilePicker({ suggestedName: "Nouveau projet" + PROJ_EXT, types: FILE_TYPES, ...(await WorkDir.pickerStart()) }); }
    catch (e) { return null; }   // fenêtre fermée
    const p = this.register(Store.blank(this.baseName(handle.name)), handle);
    await this.write(p);
    this.recentKeys.set(p.id, await Recents.add(handle, p.title));
    return p;
  },

  // Nouveau projet rempli par « build » (import Excel / CSV) : on choisit où l'enregistrer
  async createFrom(title, build) {
    const p = Store.blank(title);
    build(p);
    if (!this.supported) return this.register(p, null);
    let handle;
    try { handle = await window.showSaveFilePicker({ suggestedName: this.safeName(title) + PROJ_EXT, types: FILE_TYPES, ...(await WorkDir.pickerStart()) }); }
    catch (e) { return null; }
    p.title = this.baseName(handle.name);
    this.register(p, handle);
    await this.write(p);
    this.recentKeys.set(p.id, await Recents.add(handle, p.title));
    return p;
  },

  // Ouvrir un fichier : fenêtre de choix (ou champ fichier sur les navigateurs sans écriture directe)
  async open() {
    if (!this.supported) {
      const file = await new Promise((resolve) => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = PROJ_EXT + "," + LEGACY_EXT;
        input.onchange = () => resolve(input.files[0] || null);
        input.click();
      });
      if (!file) return null;
      const res = await this.fromFile(file, file.name);
      if (res.foreign && !(await this.confirmForeign(file.name))) return null;
      return this.register(res.p, null);
    }
    let handle;
    try { [handle] = await window.showOpenFilePicker({ types: OPEN_TYPES, multiple: false, ...(await WorkDir.pickerStart()) }); }
    catch (e) { return null; }
    try { await handle.requestPermission({ mode: "readwrite" }); } catch (e) { /* demandé plus tard */ }
    return this.openHandle(handle);
  },

  async openHandle(handle) {
    for (const [id, h] of this.handles) {
      try { if (await h.isSameEntry(handle)) return Store.getProject(id); } catch (e) { /* ignoré */ }
    }
    const file = await handle.getFile();
    const res = await this.fromFile(file, handle.name);
    if (this.isLegacy(handle.name)) return this.convertLegacy(handle, res.p);
    if (res.foreign) {
      // classeur qui ne vient pas de Plan Projet : l'importer, ou l'ouvrir en acceptant de le réécrire
      const choice = await this.confirmForeign(handle.name, true);
      if (!choice) return null;
      if (choice === "import") return this.createFrom(this.baseName(handle.name) + " (projet)", (q) => { q.tasks = res.p.tasks; q.links = res.p.links; });
    }
    const p = this.register(res.p, handle);
    p.title = this.baseName(handle.name);   // fichier renommé sur le PC : le projet prend son nom
    if (res.edited) toast("Les modifications faites dans Excel ont été reprises (la mise en forme Excel n'est pas conservée)");
    const perm = await handle.queryPermission?.({ mode: "readwrite" });
    if (perm && perm !== "granted") this.setState(p.id, "permission");
    this.recentKeys.set(p.id, await Recents.add(handle, p.title));
    return p;
  },

  // ancien fichier .proj : on l'enregistre une fois en classeur .xlsx, qui devient le fichier du projet
  async convertLegacy(handle, old) {
    const ok = await confirmDialog({
      title: "Ancien format de fichier",
      message: `« ${handle.name} » est au format .proj, qui n'est plus utilisé.\n` +
        "Le projet va être enregistré en classeur Excel (.xlsx). L'ancien fichier ne sera plus modifié : vous pourrez le supprimer.",
      okLabel: "Enregistrer en .xlsx", cancelLabel: "Annuler", focusOk: true,
    });
    if (!ok) return null;
    const p = await this.createFrom(this.baseName(handle.name), (q) => {
      q.tasks = old.tasks; q.links = old.links; q.ui = old.ui; q.createdAt = old.createdAt;
    });
    if (!p) return null;
    const entry = await Recents.find(handle);
    if (entry) await Recents.remove(entry.key);
    toast("Projet converti en classeur Excel");
    return p;
  },

  // classeur Excel qui n'a pas été créé par Plan Projet
  async confirmForeign(name, canImport) {
    const choices = [{ label: "Annuler", value: null }, { label: "Ouvrir et réécrire ce classeur", value: "rewrite" }];
    if (canImport) choices.push({ label: "Importer dans un nouveau projet", value: "import", primary: true });
    else choices[1].primary = true;
    return choiceDialog({
      title: "Ce classeur n'a pas été créé par Plan Projet",
      message: `« ${name} » sera lu comme un planning (colonnes de niveau 1, 2, 3…, Responsable, Heures…).\n` +
        "L'ouvrir comme projet le réécrira au format de l'application : sa mise en forme et ses autres feuilles seront perdues.",
      choices,
    });
  },

  // enregistrement en temps réel : quelques instants après la dernière modification
  queue(p) {
    this.dirty.add(p.id);
    if (!this.handles.has(p.id)) { this.setState(p.id, "unsaved"); return; }
    if (this.states.get(p.id) === "permission") return;
    clearTimeout(this.timers.get(p.id));
    this.setState(p.id, "saving");
    this.timers.set(p.id, setTimeout(() => { this.timers.delete(p.id); this.write(p); }, 300));
  },

  async write(p) {
    const handle = this.handles.get(p.id);
    if (!handle) return false;
    const job = (this.chains.get(p.id) || Promise.resolve()).then(async () => {
      const w = await handle.createWritable();
      await w.write(this.toBytes(p));
      await w.close();
    });
    this.chains.set(p.id, job.catch(() => {}));
    try {
      await job;
      this.dirty.delete(p.id);
      this.setState(p.id, "saved");
      Recents.touch(handle, p.title);
      return true;
    } catch (e) {
      this.setState(p.id, e && e.name === "NotAllowedError" ? "permission" : "error");
      return false;
    }
  },

  // autorisation d'écrire dans le fichier (demandée sur un clic de l'utilisateur)
  async allow(p) {
    const handle = this.handles.get(p.id);
    if (!handle) return false;
    try {
      if ((await handle.requestPermission({ mode: "readwrite" })) !== "granted") return false;
    } catch (e) { return false; }
    this.setState(p.id, "saving");
    return this.write(p);
  },

  // Ctrl + S : enregistre immédiatement (ou télécharge si le navigateur n'écrit pas dans les fichiers)
  async flush(p) {
    clearTimeout(this.timers.get(p.id));
    this.timers.delete(p.id);
    if (!this.handles.has(p.id)) return this.saveAs(p);
    if (this.states.get(p.id) === "permission") return this.allow(p);
    this.setState(p.id, "saving");
    return this.write(p);
  },

  async saveAs(p) {
    if (!this.supported) { this.download(p); this.setState(p.id, "saved"); return true; }
    let handle;
    try { handle = await window.showSaveFilePicker({ suggestedName: this.safeName(p.title) + PROJ_EXT, types: FILE_TYPES, ...(await WorkDir.pickerStart()) }); }
    catch (e) { return false; }
    this.handles.set(p.id, handle);
    this.setState(p.id, "saving");
    const ok = await this.write(p);
    this.recentKeys.set(p.id, await Recents.add(handle, p.title));
    return ok;
  },

  download(p) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([this.toBytes(p)], { type: XLSX_MIME }));
    a.download = this.safeName(p.title) + PROJ_EXT;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  // des modifications ne sont pas encore écrites dans un fichier
  hasPending() {
    return [...this.dirty].some((id) => Store.getProject(id) && this.handles.has(id));
  },

  /* --- Projet ouvert dans cet onglet : retrouvé après une actualisation de la page (F5) --- */
  SESSION_KEY: "plan-projet:ouvert",
  remember(p) {
    try {
      sessionStorage.setItem(this.SESSION_KEY, JSON.stringify({
        id: p.id, key: this.recentKeys.get(p.id) || null, text: this.toText(p), dirty: this.dirty.has(p.id),
      }));
    } catch (e) { /* stockage de l'onglet indisponible */ }
  },
  forget() { try { sessionStorage.removeItem(this.SESSION_KEY); sessionStorage.removeItem(HISTORY_KEY); } catch (e) { /* ignoré */ } },
  async restore(id) {
    let snap = null;
    try { snap = JSON.parse(sessionStorage.getItem(this.SESSION_KEY)); } catch (e) { snap = null; }
    if (!snap || snap.id !== id) return null;
    const p = this.fromText(snap.text, "Projet");
    p.id = id;
    const entry = snap.key ? await Recents.get(snap.key) : null;
    this.register(p, entry ? entry.handle : null);
    if (entry) {
      this.recentKeys.set(id, snap.key);
      let perm = "granted";
      try { perm = await entry.handle.queryPermission({ mode: "readwrite" }); } catch (e) { /* ignoré */ }
      if (snap.dirty) this.dirty.add(id);
      if (perm !== "granted") this.setState(id, "permission");
      else if (snap.dirty) this.queue(p);
    } else if (snap.dirty) this.dirty.add(id);
    return p;
  },
};

/* ============================================================
   Fichiers récents (mémorisés dans le navigateur, IndexedDB)
   ============================================================ */
const Recents = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((resolve, reject) => {
      const req = indexedDB.open("plan-projet", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("recents", { keyPath: "key" });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return this.db;
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("recents", mode);
      const out = fn(tx.objectStore("recents"));
      tx.oncomplete = () => resolve(out && out.result !== undefined ? out.result : undefined);
      tx.onerror = () => reject(tx.error);
    });
  },
  async list() {
    try { return ((await this.run("readonly", (st) => st.getAll())) || []).filter((e) => e.key !== WORKDIR_KEY).sort((a, b) => b.openedAt - a.openedAt); }
    catch (e) { return []; }
  },
  async find(handle) {
    for (const e of await this.list()) {
      try { if (await e.handle.isSameEntry(handle)) return e; } catch (err) { /* ignoré */ }
    }
    return null;
  },
  // ajoute (ou remonte en tête) un fichier ; 12 fichiers au plus
  async add(handle, title) {
    try {
      const e = (await this.find(handle)) || { key: uid("r") };
      Object.assign(e, { handle, name: handle.name, title, openedAt: Date.now() });
      await this.run("readwrite", (st) => st.put(e));
      const all = await this.list();
      for (const old of all.slice(12)) await this.remove(old.key);
      return e.key;
    } catch (err) { return null; /* liste des récents indisponible */ }
  },
  async get(key) {
    try { return (await this.run("readonly", (st) => st.get(key))) || null; } catch (err) { return null; }
  },
  // met à jour le titre affiché (sans changer l'ordre)
  async touch(handle, title) {
    try {
      const e = await this.find(handle);
      if (e && (e.title !== title || e.name !== handle.name)) { e.title = title; e.name = handle.name; await this.run("readwrite", (st) => st.put(e)); }
    } catch (err) { /* ignoré */ }
  },
  async remove(key) {
    try { await this.run("readwrite", (st) => st.delete(key)); } catch (err) { /* ignoré */ }
  },
};

/* ============================================================
   Dossier de travail : le navigateur ne donne pas le chemin complet d'un fichier,
   mais il sait dire où il se trouve à l'intérieur d'un dossier choisi par l'utilisateur
   ============================================================ */
const WORKDIR_KEY = "dossier-de-travail";   // mémorisé avec les fichiers récents (IndexedDB)
const WorkDir = {
  supported: typeof window.showDirectoryPicker === "function",
  handle: null,
  loading: null,
  load() {
    if (!this.loading) this.loading = Recents.get(WORKDIR_KEY).then((e) => { this.handle = e ? e.handle : null; });
    return this.loading.then(() => this.handle);   // dossier actuel, même s'il a été changé depuis
  },
  async choose() {
    await this.load();
    let h;
    try { h = await window.showDirectoryPicker({ id: "plan-projet-dossier", mode: "read", ...(this.handle ? { startIn: this.handle } : { startIn: "documents" }) }); }
    catch (e) { return false; }   // fenêtre fermée
    this.handle = h;
    try { await Recents.run("readwrite", (st) => st.put({ key: WORKDIR_KEY, handle: h, name: h.name })); } catch (e) { /* non mémorisé */ }
    this.changed();
    return true;
  },
  async clear() {
    this.handle = null;
    await Recents.remove(WORKDIR_KEY);
    this.changed();
  },
  changed() { document.dispatchEvent(new CustomEvent("workdir")); },
  // les fenêtres Ouvrir / Enregistrer s'ouvrent dans le dossier de travail
  async pickerStart() { return (await this.load()) ? { startIn: this.handle } : {}; },
  // chemin du fichier à partir du dossier de travail (["Projets", "Chantier A", "Planning.xlsx"]), null s'il est ailleurs
  async pathOf(fileHandle) {
    const dir = await this.load();
    if (!dir || !fileHandle) return null;
    try {
      const parts = await dir.resolve(fileHandle);
      return parts ? [dir.name, ...parts] : null;
    } catch (e) { return null; }
  },
};

/* ============================================================
   Paramètres : couleurs (fond, tâches) et police d'écriture
   ============================================================ */
const Settings = {
  FONTS: [
    { name: "Inter", google: "Inter:wght@400;500;600;700" },
    { name: "Roboto", google: "Roboto:wght@400;500;700" },
    { name: "Open Sans", google: "Open+Sans:wght@400;500;600;700" },
    { name: "Lato", google: "Lato:wght@400;700" },
    { name: "Nunito", google: "Nunito:wght@400;600;700" },
    { name: "Poppins", google: "Poppins:wght@400;500;600;700" },
    { name: "Montserrat", google: "Montserrat:wght@400;500;600;700" },
    { name: "Source Sans 3", google: "Source+Sans+3:wght@400;600;700" },
    { name: "Arial" },
    { name: "Segoe UI" },
  ],
  COLORS: [
    { key: "task", label: "Tâches" },
    { key: "summary", label: "Tâches mères" },
  ],
  get() { return (Store.data.settings = Store.data.settings || {}); },

  loadFont(name) {
    const f = this.FONTS.find((x) => x.name === name);
    if (!f || !f.google || document.querySelector(`link[data-font="${name}"]`)) return;
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?family=${f.google}&display=swap`;
    l.dataset.font = name;
    document.head.appendChild(l);
  },

  // applique les réglages ; le fond est propre à chaque mode (clair / sombre)
  apply() {
    const st = this.get(), root = document.documentElement.style;
    if (st.font) { this.loadFont(st.font); root.setProperty("--font", `"${st.font}", system-ui, sans-serif`); }
    else root.removeProperty("--font");
    this.COLORS.forEach(({ key }) => { if (st[key]) root.setProperty("--" + key, st[key]); else root.removeProperty("--" + key); });
    const bg = st["bg-" + Theme.current()];
    if (bg) {
      const dark = Theme.current() === "dark";
      root.setProperty("--surface", bg);
      root.setProperty("--bg", `color-mix(in srgb, ${bg} ${dark ? 80 : 95}%, ${dark ? "#000" : "#5a6080"})`);
      root.setProperty("--surface-2", `color-mix(in srgb, ${bg} 92%, ${dark ? "#fff" : "#5a6080"})`);
    } else ["--surface", "--bg", "--surface-2"].forEach((v) => root.removeProperty(v));
  },

  set(key, value) {
    const st = this.get();
    if (value == null) delete st[key]; else st[key] = value;
    Store.save();
    this.apply();
  },

  // couleur actuelle d'une variable CSS, au format #rrggbb pour les sélecteurs de couleur
  current(varName) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    if (/^#[0-9a-f]{6}$/i.test(v)) return v;
    const c = document.createElement("canvas").getContext("2d");
    c.fillStyle = v || "#000";
    return /^#[0-9a-f]{6}$/i.test(c.fillStyle) ? c.fillStyle : "#000000";
  },

  open(anchor) {
    document.querySelector(".settings-panel")?.remove();
    const st = this.get();
    const panel = document.createElement("div");
    panel.className = "settings-panel";
    const font = st.font || "Inter";
    panel.innerHTML = `
      <h3>Paramètres</h3>
      <h4>Police d'écriture</h4>
      <div class="set-row"><select data-k="font" aria-label="Police d'écriture">${this.FONTS.map((f) =>
        `<option${f.name === font ? " selected" : ""} style="font-family:'${f.name}'">${f.name}</option>`).join("")}</select></div>
      <h4>Fond (mode ${Theme.current() === "dark" ? "sombre" : "clair"})</h4>
      <div class="set-row"><span>Couleur de fond</span><input type="color" data-k="bg" value="${this.current("--surface")}"></div>
      <h4>Couleurs des tâches</h4>
      ${this.COLORS.map((c) => `<div class="set-row"><span>${c.label}</span><input type="color" data-k="${c.key}" value="${this.current(c.key === "summary" ? (st.summary ? "--summary" : "--summary-default") : "--" + c.key)}"></div>`).join("")}
      ${ProjectView.coefTarget() ? `<h4>Projet en cours</h4>
      <div class="set-row"><span>Durée jours = Heures ×</span><input class="coef-input" data-k="coef" value="${fmtNum(HOURS_TO_DAYS)}" inputmode="decimal" aria-label="Coefficient de la durée en jours"></div>` : ""}
      ${WorkDir.supported ? `<h4>Dossier de travail</h4>
      <div class="set-row"><span class="workdir-name">${WorkDir.handle ? `${ICONS.folder} ${esc(WorkDir.handle.name)}` : "Aucun"}</span></div>
      <div class="set-row set-btns"><button class="btn" data-act="workdir">${WorkDir.handle ? "Changer…" : "Choisir…"}</button>${WorkDir.handle ? `<button class="btn" data-act="workdir-clear">Retirer</button>` : ""}</div>` : ""}
      <button class="btn" data-act="reset">Rétablir les réglages d'origine</button>`;
    panel.querySelector('[data-k="font"]').addEventListener("change", (e) => this.set("font", e.target.value === "Inter" ? null : e.target.value));
    panel.querySelectorAll('input[type="color"]').forEach((inp) => inp.addEventListener("input", () => {
      const k = inp.dataset.k === "bg" ? "bg-" + Theme.current() : inp.dataset.k;
      this.set(k, inp.value);
    }));
    const coefIn = panel.querySelector('[data-k="coef"]');
    if (coefIn) {
      const apply = () => {
        const v = parseNum(coefIn.value);
        if (isNaN(v) || v <= 0) { toast("Coefficient incorrect : saisir un nombre supérieur à 0 (ex. 1,5)"); coefIn.value = fmtNum(HOURS_TO_DAYS); return; }
        document.dispatchEvent(new CustomEvent("coef", { detail: v }));
        coefIn.value = fmtNum(HOURS_TO_DAYS);
      };
      coefIn.addEventListener("change", apply);
      coefIn.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); coefIn.blur(); } });
    }
    panel.querySelector('[data-act="workdir"]')?.addEventListener("click", async () => { if (await WorkDir.choose()) this.open(anchor); });
    panel.querySelector('[data-act="workdir-clear"]')?.addEventListener("click", async () => { await WorkDir.clear(); this.open(anchor); });
    panel.querySelector('[data-act="reset"]').addEventListener("click", () => {
      Store.data.settings = {};
      Store.save();
      this.apply();
      this.open(anchor);
    });
    document.body.appendChild(panel);
    const close = (e) => {
      if (e.type === "keydown" ? e.key !== "Escape" : panel.contains(e.target) || anchor.contains(e.target)) return;
      panel.remove();
      document.removeEventListener("mousedown", close, true);
      document.removeEventListener("keydown", close, true);
    };
    document.addEventListener("mousedown", close, true);
    document.addEventListener("keydown", close, true);
  },

  button() {
    const b = document.createElement("button");
    b.className = "icon-btn";
    b.innerHTML = ICONS.gear;
    setTip(b, "Paramètres", "Couleurs, police d'écriture et dossier de travail");
    b.addEventListener("click", () => {
      if (document.querySelector(".settings-panel")) document.querySelector(".settings-panel").remove();
      else this.open(b);
    });
    return b;
  },
};

/* ============================================================
   Plein écran : toute l'application occupe l'écran
   ============================================================ */
const Fullscreen = {
  supported: !!(document.documentElement.requestFullscreen && document.exitFullscreen),
  active() { return !!document.fullscreenElement; },
  async toggle() {
    try {
      if (this.active()) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    } catch (e) { toast("Le plein écran n'est pas disponible dans ce navigateur"); }
  },
  paint(btn) {
    const on = this.active();
    btn.innerHTML = on ? ICONS.exitFullscreen : ICONS.fullscreen;
    if (on) setTip(btn, "Quitter le plein écran", "", "Échap");
    else setTip(btn, "Plein écran");
  },
  button() {
    const b = document.createElement("button");
    b.className = "icon-btn";
    b.dataset.fullscreenBtn = "";
    if (!this.supported) b.hidden = true;
    b.addEventListener("click", () => this.toggle());
    this.paint(b);
    return b;
  },
};
document.addEventListener("fullscreenchange", () => {
  document.querySelectorAll("[data-fullscreen-btn]").forEach((b) => Fullscreen.paint(b));
});

/* ============================================================
   Thème clair / sombre
   ============================================================ */
const Theme = {
  current() { return document.documentElement.dataset.theme || "light"; },
  init() {
    const saved = Store.data.theme;
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    this.apply(saved || (prefersDark ? "dark" : "light"));
  },
  apply(t) { document.documentElement.dataset.theme = t; Settings.apply(); },
  toggle() {
    const next = this.current() === "dark" ? "light" : "dark";
    this.apply(next);
    Store.data.theme = next;
    Store.save();
    document.querySelectorAll("[data-theme-btn]").forEach((b) => this.paintButton(b));
    document.querySelector(".settings-panel")?.remove();
  },
  paintButton(btn) {
    const dark = this.current() === "dark";
    btn.innerHTML = dark ? ICONS.sun : ICONS.moon;
    setTip(btn, dark ? "Mode clair" : "Mode sombre", dark ? "Passer en mode clair" : "Passer en mode sombre");
  },
  button() {
    const b = document.createElement("button");
    b.className = "icon-btn";
    b.dataset.themeBtn = "";
    b.addEventListener("click", () => this.toggle());
    this.paintButton(b);
    return b;
  },
};

// fenêtre des commentaires d'une tâche : enregistrés à la fermeture (croix, Échap ou clic à côté)
function commentDialog(task, onClose) {
  const bd = document.createElement("div");
  bd.className = "modal-backdrop";
  bd.innerHTML = `
    <div class="modal comment-modal" role="dialog" aria-modal="true" aria-label="Commentaires">
      <div class="comment-head">
        <h3>${ICONS.comment}<span>Commentaires — ${esc(task.label || "(sans nom)")}</span></h3>
        <button class="icon-btn modal-close" data-act="close" ${tipAttrs("Fermer", "Les commentaires sont enregistrés", "Échap")}>${ICONS.close}</button>
      </div>
      <textarea class="comment-text" placeholder="Écrire un commentaire…" spellcheck="true"></textarea>
    </div>`;
  const ta = bd.querySelector("textarea");
  ta.value = task.comment || "";
  const close = () => {
    document.removeEventListener("keydown", onKey, true);
    Tip.hide();
    bd.remove();
    onClose(ta.value.replace(/\s+$/, ""));
  };
  const onKey = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  bd.querySelector('[data-act="close"]').addEventListener("click", close);
  bd.addEventListener("mousedown", (e) => { if (e.target === bd) close(); });
  document.body.appendChild(bd);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

function confirmDialog({ title, message, okLabel = "Confirmer", cancelLabel = "Annuler", danger = false, focusOk = false }) {
  return new Promise((resolve) => {
    const bd = document.createElement("div");
    bd.className = "modal-backdrop";
    bd.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="modal-actions">
          <button class="btn" data-act="cancel">${esc(cancelLabel)}</button>
          <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-act="ok">${esc(okLabel)}</button>
        </div>
      </div>`;
    const close = (val) => { bd.remove(); document.removeEventListener("keydown", onKey, true); resolve(val); };
    const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(false); } };
    bd.addEventListener("click", (e) => {
      if (e.target === bd) close(false);
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act) close(act === "ok");
    });
    document.addEventListener("keydown", onKey, true);
    document.body.appendChild(bd);
    bd.querySelector(focusOk ? '[data-act="ok"]' : '[data-act="cancel"]').focus();
  });
}

// attributs d'un bouton : kbd = touches séparées par « + », variantes par « | »
const tipAttrs = (name, desc = "", kbd = "") =>
  `aria-label="${esc(name)}" data-tip="${esc(name)}"${desc ? ` data-desc="${esc(desc)}"` : ""}${kbd ? ` data-kbd="${esc(kbd)}"` : ""}`;
const setTip = (el, name, desc = "", kbd = "") => {
  el.removeAttribute("title");
  el.setAttribute("aria-label", name);
  el.dataset.tip = name;
  if (desc) el.dataset.desc = desc; else delete el.dataset.desc;
  if (kbd) el.dataset.kbd = kbd; else delete el.dataset.kbd;
};
const Tip = {
  el: null, timer: null, target: null,
  show(t) {
    this.target = t;
    if (!this.el) { this.el = document.createElement("div"); this.el.className = "tip"; this.el.setAttribute("role", "tooltip"); }
    const kbd = t.dataset.kbd ? t.dataset.kbd.split("|").map((v) => v.split("+").map((k) => `<kbd>${esc(k.trim())}</kbd>`).join(" + ")).join(" ou ") : "";
    this.el.innerHTML = `<b>${esc(t.dataset.tip)}</b>${t.dataset.desc ? `<div class="tip-desc">${esc(t.dataset.desc)}</div>` : ""}${kbd ? `<div class="tip-kbd">${kbd}</div>` : ""}`;
    this.el.classList.remove("on");
    document.body.appendChild(this.el);
    const r = t.getBoundingClientRect(), w = this.el.offsetWidth, h = this.el.offsetHeight;
    const left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    const top = r.bottom + 8 + h > window.innerHeight ? r.top - h - 8 : r.bottom + 8;
    Object.assign(this.el.style, { left: left + "px", top: top + "px" });
    requestAnimationFrame(() => this.el && this.el.classList.add("on"));
  },
  hide() {
    clearTimeout(this.timer);
    this.target = null;
    if (this.el) this.el.remove();
  },
};
document.addEventListener("pointerover", (e) => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (t === Tip.target) return;
  Tip.hide();
  if (t && e.pointerType !== "touch") { Tip.target = t; Tip.timer = setTimeout(() => { if (t.isConnected) Tip.show(t); }, 350); }
});
document.addEventListener("pointerdown", () => Tip.hide(), true);
document.addEventListener("keydown", () => Tip.hide(), true);
window.addEventListener("blur", () => Tip.hide());

        </div>

      if (span) span.textContent = parts.join(" › ");

    slot.querySelectorAll(".card.recent").forEach((card) => {
      const entry = list.find((e) => e.key === card.dataset.key);
      const openIt = async () => {
        try {
          const h = entry.handle;
          if ((await h.queryPermission({ mode: "readwrite" })) !== "granted"
            && (await h.requestPermission({ mode: "readwrite" })) !== "granted") {
            toast("Accès au fichier refusé");
            return;
          }
          openProject(await Files.openHandle(h));
        } catch (e) {
          toast(e && e.name === "NotFoundError" ? "Fichier introuvable : il a peut-être été déplacé ou supprimé" : "Impossible d'ouvrir ce fichier");
        }
      };
      card.addEventListener("click", (ev) => { if (!ev.target.closest('[data-act="forget"]')) openIt(); });
      card.addEventListener("keydown", (ev) => { if (ev.key === "Enter") openIt(); });
      card.querySelector('[data-act="forget"]').addEventListener("click", async () => {
        await Recents.remove(entry.key);
        this.renderRecents(root);
      });
    });
  },
};

const ZOOMS = [6, 10, 14, 20, 28, 40, 56];
