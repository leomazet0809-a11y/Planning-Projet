<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Projet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Thème (tokens) — clair par défaut, sombre via [data-theme]
   ============================================================ */
:root {
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f0f2f8;
  --border: #e3e6ef;
  --text: #1b1e2b;
  --text-muted: #6b7189;
  --accent: #5b5bf0;
  --accent-soft: #e9e9fe;
  --accent-text: #ffffff;
  --danger: #e5484d;
  --danger-soft: #fdecec;
  --shadow: 0 1px 2px rgba(20, 24, 40, .05), 0 4px 16px rgba(20, 24, 40, .06);
  --radius: 14px;
  --radius-sm: 8px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #171a23;
  --surface-2: #1f2330;
  --border: #2a2f3e;
  --text: #e8eaf2;
  --text-muted: #9097ad;
  --accent: #8484ff;
  --accent-soft: #262a52;
  --accent-text: #0f1117;
  --danger: #ff6b6f;
  --danger-soft: #3a1d22;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}
button { font: inherit; color: inherit; }

/* ---------- Barre du haut ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  height: 60px; padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.brand-logo {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), #b07cff);
  display: grid; place-items: center; color: #fff; font-size: 15px;
}
.spacer { flex: 1; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); cursor: pointer;
  font-weight: 500; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg, .btn svg { width: 18px; height: 18px; }

/* ---------- Page Menu ---------- */
.menu-page { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
.menu-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.menu-head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.menu-head p { margin: 4px 0 0; color: var(--text-muted); }
.grid-cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; display: flex; flex-direction: column; gap: 6px;
  transition: border-color .15s;
}
.card:hover { border-color: var(--accent); }
.card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.inline-edit {
  width: 100%; border: 1px solid transparent; border-radius: var(--radius-sm);
  background: transparent; color: var(--text); font: inherit;
  padding: 4px 6px; margin-left: -7px;
}
.inline-edit:hover { border-color: var(--border); }
.inline-edit:focus { outline: none; border-color: var(--accent); background: var(--surface-2); }
.inline-edit.name { font-size: 17px; font-weight: 600; }
.inline-edit.title { color: var(--text-muted); }
.card-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.card-actions { display: flex; gap: 8px; margin-top: 12px; }
.card-actions .btn-primary { flex: 1; justify-content: center; }
.empty {
  text-align: center; padding: 64px 24px; color: var(--text-muted);
  border: 2px dashed var(--border); border-radius: var(--radius);
}
.empty h2 { color: var(--text); margin: 0 0 6px; font-size: 18px; }

/* ---------- Page Projet ---------- */
.project-title {
  flex: 1; min-width: 0; font-size: 18px; font-weight: 600;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: transparent; color: var(--text); font-family: inherit; padding: 6px 10px;
}
.project-title:hover { border-color: var(--border); }
.project-title:focus { outline: none; border-color: var(--accent); background: var(--surface-2); }
.project-page { display: flex; flex-direction: column; height: 100vh; --row-h: 34px; --head-h: 66px; }
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.split { flex: 1; min-height: 0; display: flex; background: var(--surface); }
.pane { display: flex; flex-direction: column; min-width: 0; }
.pane-left { flex: 0 0 auto; }
.pane-right { flex: 1 1 auto; }
.pane-head {
  flex: 0 0 auto; height: var(--head-h); overflow: hidden;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.pane-body { flex: 1; min-height: 0; }
/* une seule barre verticale : celle du planning, collée au bord droit de la fenêtre */
.pane-left .pane-body { overflow-x: scroll; overflow-y: hidden; }
.pane-right .pane-body { overflow: scroll; }

/* ---------- Séparateur tableau / planning ---------- */
.splitter {
  flex: 0 0 7px; cursor: col-resize; position: relative;
  background: var(--border); transition: background .15s;
}
.splitter::after {
  content: ""; position: absolute; left: 2px; top: 50%; width: 3px; height: 32px;
  transform: translateY(-50%); border-radius: 2px;
  background: repeating-linear-gradient(var(--text-muted) 0 3px, transparent 3px 6px);
  opacity: .6;
}
.splitter:hover, .splitter.dragging, .splitter:focus-visible { background: var(--accent); outline: none; }
.splitter:hover::after, .splitter.dragging::after { background: repeating-linear-gradient(#fff 0 3px, transparent 3px 6px); opacity: 1; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }

/* ---------- Tableau ---------- */
.trow { display: flex; height: var(--row-h); border-bottom: 1px solid var(--border); width: max-content; min-width: 100%; }
.tcell {
  flex: 0 0 auto; border-right: 1px solid var(--border);
  padding: 0 10px; line-height: var(--row-h);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.thead-row { height: var(--head-h); border-bottom: 0; }
.thead-row .tcell {
  display: flex; align-items: flex-end; padding-bottom: 8px; line-height: 1.25;
  white-space: normal; font-size: 12px; font-weight: 600; color: var(--text-muted);
}
.tcell.num { text-align: right; }
.trow:hover { background: var(--surface-2); }
.table-empty { padding: 32px 24px; color: var(--text-muted); }

/* ---------- Planning (contenu à l'étape 6) ---------- */
.gantt-head-msg { height: 100%; display: flex; align-items: center; padding: 0 20px; color: var(--text-muted); font-size: 13px; }
.grow { height: var(--row-h); border-bottom: 1px solid var(--border); }

/* ---------- Fenêtre de confirmation ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10, 12, 20, .45); display: grid; place-items: center; padding: 16px;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 24px; width: min(420px, 100%);
}
.modal h3 { margin: 0 0 8px; font-size: 17px; }
.modal p { margin: 0 0 20px; color: var(--text-muted); line-height: 1.5; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

@media (max-width: 640px) {
  .topbar { padding: 0 16px; }
  .menu-page { padding: 24px 16px 48px; }
  .brand span { display: none; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ============================================================
   Utilitaires
   ============================================================ */
const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const formatDateFR = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ICONS = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
};

/* ============================================================
   Store — données + sauvegarde automatique (localStorage)
   ============================================================ */
const STORAGE_KEY = "plan-projet:v1";

const Store = {
  data: null,

  load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { raw = null; }
    this.data = raw && Array.isArray(raw.projects) ? raw : { version: 1, theme: null, projects: [] };
  },

  save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch (e) { console.warn("Sauvegarde impossible", e); }
  },

  getProject(id) { return this.data.projects.find((p) => p.id === id); },

  createProject() {
    const n = this.data.projects.length + 1;
    const p = {
      id: uid("p"),
      name: "Nouveau projet " + n,
      title: "Titre du projet",
      createdAt: todayISO(),
      updatedAt: todayISO(),
      ui: {},
      tasks: [],
      links: [],
    };
    this.data.projects.unshift(p);
    this.save();
    return p;
  },

  updateProject(id, patch) {
    const p = this.getProject(id);
    if (!p) return;
    Object.assign(p, patch, { updatedAt: todayISO() });
    this.save();
  },

  duplicateProject(id) {
    const src = this.getProject(id);
    if (!src) return;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid("p");
    copy.name = src.name + " (copie)";
    copy.createdAt = copy.updatedAt = todayISO();
    const idx = this.data.projects.indexOf(src);
    this.data.projects.splice(idx + 1, 0, copy);
    this.save();
  },

  addTask(projectId) {
    const p = this.getProject(projectId);
    const t = { id: uid("t"), level: 1, label: "", realise: "", surveille: "", heures: "", start: null };
    p.tasks.push(t);
    this.updateProject(projectId, {});
    return t;
  },

  deleteProject(id) {
    this.data.projects = this.data.projects.filter((p) => p.id !== id);
    this.save();
  },
};

/* ============================================================
   Thème clair / sombre
   ============================================================ */
const Theme = {
  current() { return document.documentElement.dataset.theme || "light"; },
  init() {
    const saved = Store.data.theme;
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    this.apply(saved || (prefersDark ? "dark" : "light"));
  },
  apply(t) { document.documentElement.dataset.theme = t; },
  toggle() {
    const next = this.current() === "dark" ? "light" : "dark";
    this.apply(next);
    Store.data.theme = next;
    Store.save();
    document.querySelectorAll("[data-theme-btn]").forEach((b) => this.paintButton(b));
  },
  paintButton(btn) {
    const dark = this.current() === "dark";
    btn.innerHTML = dark ? ICONS.sun : ICONS.moon;
    btn.title = dark ? "Passer en mode clair" : "Passer en mode sombre";
    btn.setAttribute("aria-label", btn.title);
  },
  button() {
    const b = document.createElement("button");
    b.className = "icon-btn";
    b.dataset.themeBtn = "";
    b.addEventListener("click", () => this.toggle());
    this.paintButton(b);
    return b;
  },
};

/* ============================================================
   Fenêtre de confirmation
   ============================================================ */
function confirmDialog({ title, message, okLabel = "Confirmer", danger = false }) {
  return new Promise((resolve) => {
    const bd = document.createElement("div");
    bd.className = "modal-backdrop";
    bd.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="modal-actions">
          <button class="btn" data-act="cancel">Annuler</button>
          <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-act="ok">${esc(okLabel)}</button>
        </div>
      </div>`;
    const close = (val) => { bd.remove(); document.removeEventListener("keydown", onKey); resolve(val); };
    const onKey = (e) => { if (e.key === "Escape") close(false); };
    bd.addEventListener("click", (e) => {
      if (e.target === bd) close(false);
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act) close(act === "ok");
    });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(bd);
    bd.querySelector('[data-act="cancel"]').focus();
  });
}

/* Champ texte modifiable directement : Entrée ou clic ailleurs = enregistrer, Échap = annuler */
function bindInlineEdit(input, onCommit) {
  let original = input.value;
  input.addEventListener("focus", () => { original = input.value; });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { input.value = original; input.blur(); }
  });
  input.addEventListener("blur", () => {
    const v = input.value.trim();
    if (!v) { input.value = original; return; }
    if (v !== original) onCommit(v);
  });
}

/* ============================================================
   Page Menu
   ============================================================ */
const MenuView = {
  render(root) {
    const projects = Store.data.projects;
    root.innerHTML = `
      <header class="topbar">
        <div class="brand"><div class="brand-logo">▦</div><span>Plan Projet</span></div>
        <div class="spacer"></div>
        <div data-slot="theme"></div>
      </header>
      <main class="menu-page">
        <div class="menu-head">
          <div>
            <h1>Mes projets</h1>
            <p>Cliquez sur un nom ou un titre pour le modifier. Ouvrez un projet pour planifier ses tâches.</p>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-primary" data-act="new">${ICONS.plus} Nouveau projet</button>
        </div>
        ${projects.length ? `<div class="grid-cards">${projects.map(cardHTML).join("")}</div>` : `
          <div class="empty">
            <h2>Aucun projet pour l'instant</h2>
            <p>Créez votre premier projet pour commencer à planifier.</p>
            <br><button class="btn btn-primary" data-act="new">${ICONS.plus} Créer un projet</button>
          </div>`}
      </main>`;

    root.querySelector('[data-slot="theme"]').replaceWith(Theme.button());

    root.querySelectorAll('[data-act="new"]').forEach((b) => b.addEventListener("click", () => {
      Store.createProject();
      MenuView.render(root);
      // place le curseur sur le nom du nouveau projet pour le renommer tout de suite
      const first = root.querySelector(".inline-edit.name");
      if (first) { first.focus(); first.select(); }
    }));

    root.querySelectorAll(".card").forEach((card) => {
      const id = card.dataset.id;
      bindInlineEdit(card.querySelector(".inline-edit.name"), (v) => Store.updateProject(id, { name: v }));
      bindInlineEdit(card.querySelector(".inline-edit.title"), (v) => Store.updateProject(id, { title: v }));
      card.querySelector('[data-act="open"]').addEventListener("click", () => Router.go("projet/" + id));
      card.querySelector('[data-act="dup"]').addEventListener("click", () => { Store.duplicateProject(id); MenuView.render(root); });
      card.querySelector('[data-act="del"]').addEventListener("click", async () => {
        const p = Store.getProject(id);
        const ok = await confirmDialog({
          title: "Supprimer ce projet ?",
          message: `« ${p.name} » et toutes ses tâches seront définitivement supprimés.`,
          okLabel: "Supprimer", danger: true,
        });
        if (ok) { Store.deleteProject(id); MenuView.render(root); }
      });
    });

    function cardHTML(p) {
      const n = p.tasks.length;
      return `
        <article class="card" data-id="${p.id}">
          <span class="card-label">Nom</span>
          <input class="inline-edit name" value="${esc(p.name)}" aria-label="Nom du projet" maxlength="80">
          <span class="card-label">Titre</span>
          <input class="inline-edit title" value="${esc(p.title)}" aria-label="Titre du projet" maxlength="120">
          <div class="card-meta">${n} tâche${n > 1 ? "s" : ""} · modifié le ${formatDateFR(p.updatedAt)}</div>
          <div class="card-actions">
            <button class="btn btn-primary" data-act="open">Ouvrir</button>
            <button class="icon-btn" data-act="dup" title="Dupliquer" aria-label="Dupliquer">${ICONS.copy}</button>
            <button class="icon-btn btn-danger" data-act="del" title="Supprimer" aria-label="Supprimer">${ICONS.trash}</button>
          </div>
        </article>`;
    }
  },
};

/* ============================================================
   Page Projet : tableau à gauche, planning à droite
   ============================================================ */
const COLUMNS = [
  { key: "niv1", label: "Niv 1", w: 170 },
  { key: "niv2", label: "Niv 2", w: 150 },
  { key: "niv3", label: "Niv 3", w: 150 },
  { key: "niv4", label: "Niv 4", w: 150 },
  { key: "realise", label: "Réalise", w: 110 },
  { key: "surveille", label: "Surveille", w: 110 },
  { key: "heures", label: "Heures effectives", w: 90, num: true },
  { key: "duree", label: "Durée jours", w: 80, num: true },
  { key: "debut", label: "Date début", w: 100 },
  { key: "fin", label: "Date fin", w: 100 },
];
const DEFAULT_GRID_RATIO = 0.55;
const MIN_PANE = 200;

function cellValue(task, key) {
  const m = key.match(/^niv(\d)$/);
  if (m) return task.level === Number(m[1]) ? task.label : "";
  if (key === "realise" || key === "surveille" || key === "heures") return task[key];
  return ""; // Durée / dates : étapes suivantes
}

const ProjectView = {
  render(root, id) {
    const p = Store.getProject(id);
    if (!p) { Router.go(""); return; }
    p.ui = p.ui || {};
    root.innerHTML = `
      <div class="project-page">
        <header class="topbar">
          <button class="btn" data-act="back">${ICONS.back} Menu</button>
          <input class="project-title" value="${esc(p.title)}" aria-label="Titre du projet" maxlength="120">
          <div data-slot="theme"></div>
        </header>
        <div class="toolbar">
          <button class="btn btn-primary" data-act="add">${ICONS.plus} Ajouter une tâche</button>
        </div>
        <div class="split">
          <section class="pane pane-left">
            <div class="pane-head"></div>
            <div class="pane-body"></div>
          </section>
          <div class="splitter" tabindex="0" role="separator" aria-orientation="vertical"
               title="Glisser pour agrandir le tableau ou le planning (double-clic : réinitialiser)"></div>
          <section class="pane pane-right">
            <div class="pane-head"><div class="gantt-head-msg">Le planning Gantt s'affichera ici (étape 6).</div></div>
            <div class="pane-body"><div class="gantt-rows"></div></div>
          </section>
        </div>
      </div>`;
    root.querySelector('[data-slot="theme"]').replaceWith(Theme.button());
    root.querySelector('[data-act="back"]').addEventListener("click", () => Router.go(""));
    bindInlineEdit(root.querySelector(".project-title"), (v) => Store.updateProject(id, { title: v }));
    document.title = p.title + " — Plan Projet";

    const el = {
      split: root.querySelector(".split"),
      left: root.querySelector(".pane-left"),
      leftHead: root.querySelector(".pane-left .pane-head"),
      leftBody: root.querySelector(".pane-left .pane-body"),
      rightHead: root.querySelector(".pane-right .pane-head"),
      rightBody: root.querySelector(".pane-right .pane-body"),
      ganttRows: root.querySelector(".gantt-rows"),
      splitter: root.querySelector(".splitter"),
    };

    const renderRows = () => {
      const widths = COLUMNS.map((c) => (p.ui.colWidths && p.ui.colWidths[c.key]) || c.w);
      const cells = (fn) => COLUMNS.map((c, i) => fn(c, widths[i])).join("");
      el.leftHead.innerHTML = `<div class="trow thead-row">${cells((c, w) => `<div class="tcell" style="width:${w}px">${esc(c.label)}</div>`)}</div>`;
      el.leftBody.innerHTML = p.tasks.length
        ? p.tasks.map((t) => `<div class="trow" data-id="${t.id}">${cells((c, w) =>
            `<div class="tcell${c.num ? " num" : ""}" style="width:${w}px">${esc(cellValue(t, c.key))}</div>`)}</div>`).join("")
        : `<div class="table-empty">Aucune tâche. Cliquez sur « Ajouter une tâche » pour commencer.</div>`;
      el.ganttRows.innerHTML = p.tasks.map(() => `<div class="grow"></div>`).join("");
    };
    renderRows();

    root.querySelector('[data-act="add"]').addEventListener("click", () => {
      Store.addTask(id);
      renderRows();
      el.rightBody.scrollTop = el.rightBody.scrollHeight;
    });

    // --- Défilement : le planning porte la barre verticale, le tableau suit ---
    el.rightBody.addEventListener("scroll", () => {
      el.leftBody.scrollTop = el.rightBody.scrollTop;
      el.rightHead.scrollLeft = el.rightBody.scrollLeft;
    });
    el.leftBody.addEventListener("scroll", () => { el.leftHead.scrollLeft = el.leftBody.scrollLeft; });
    el.leftBody.addEventListener("wheel", (e) => {
      if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; // défilement horizontal natif
      e.preventDefault();
      el.rightBody.scrollTop += e.deltaY;
    }, { passive: false });

    // --- Séparateur redimensionnable ---
    const applyRatio = () => {
      const total = el.split.clientWidth - el.splitter.offsetWidth;
      const ratio = p.ui.gridRatio ?? DEFAULT_GRID_RATIO;
      const w = Math.max(MIN_PANE, Math.min(total - MIN_PANE, Math.round(total * ratio)));
      el.left.style.width = w + "px";
    };
    const setRatio = (r) => {
      p.ui.gridRatio = Math.max(0.1, Math.min(0.9, r));
      applyRatio();
      Store.save();
    };
    applyRatio();
    window.addEventListener("resize", applyRatio);
    ProjectView.cleanup = () => window.removeEventListener("resize", applyRatio);

    el.splitter.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      el.splitter.setPointerCapture(e.pointerId);
      el.splitter.classList.add("dragging");
      document.body.classList.add("resizing");
      const startX = e.clientX, startW = el.left.offsetWidth;
      const total = el.split.clientWidth - el.splitter.offsetWidth;
      const move = (ev) => {
        const w = Math.max(MIN_PANE, Math.min(total - MIN_PANE, startW + ev.clientX - startX));
        el.left.style.width = w + "px";
      };
      const up = () => {
        el.splitter.removeEventListener("pointermove", move);
        el.splitter.classList.remove("dragging");
        document.body.classList.remove("resizing");
        setRatio(el.left.offsetWidth / total);
      };
      el.splitter.addEventListener("pointermove", move);
      el.splitter.addEventListener("pointerup", up, { once: true });
    });
    el.splitter.addEventListener("dblclick", () => setRatio(DEFAULT_GRID_RATIO));
    el.splitter.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 0.1 : 0.02;
      if (e.key === "ArrowLeft") { e.preventDefault(); setRatio((p.ui.gridRatio ?? DEFAULT_GRID_RATIO) - step); }
      if (e.key === "ArrowRight") { e.preventDefault(); setRatio((p.ui.gridRatio ?? DEFAULT_GRID_RATIO) + step); }
    });
  },
};

/* ============================================================
   Navigation (#/ = Menu, #/projet/<id> = Projet)
   ============================================================ */
const Router = {
  go(path) { location.hash = "#/" + path; },
  render() {
    const root = document.getElementById("app");
    const path = location.hash.replace(/^#\/?/, "");
    const m = path.match(/^projet\/(.+)$/);
    document.title = "Plan Projet";
    if (ProjectView.cleanup) { ProjectView.cleanup(); ProjectView.cleanup = null; }
    if (m) ProjectView.render(root, m[1]);
    else MenuView.render(root);
  },
};

Store.load();
Theme.init();
window.addEventListener("hashchange", () => Router.render());
Router.render();
</script>
</body>
</html>
